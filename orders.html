/* ==========================================================
   ONENESS CUSTOMER THEME · ORDERS APP
   ========================================================== */
:root{
 --ox-wine:#68141d;--ox-wine-dark:#430a11;--ox-wine-mid:#812531;
 --ox-gold:#c8942d;--ox-gold2:#e5bb54;--ox-paper:#fbf7ee;
 --ox-surface:#fffdf8;--ox-line:#e7dcc4;--ox-ink:#2b211c;--ox-muted:#776b61
}
body.order-console-page{
 overflow:hidden!important;
 background:radial-gradient(circle at 9% 0%,rgba(229,187,84,.075),transparent 27%),var(--ox-paper)!important
}
body.order-console-page .top{display:none!important}
body.order-console-page .main{height:100vh!important;overflow:hidden!important}
body.order-console-page .content{
 height:100vh!important;max-width:none!important;margin:0!important;padding:11px 15px 9px!important;overflow:hidden!important
}
body.order-console-page #view{
 height:100%!important;max-width:none!important;width:100%!important;padding:0!important;
 display:flex!important;flex-direction:column!important;min-height:0!important;overflow:hidden!important
}

/* real ONeness sidebar identity */
.side .brand:before{display:none!important}
.orders-side-logo{width:43px;height:38px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 3px 7px rgba(0,0,0,.18))}
.orders-side-copy{display:grid;min-width:0}
.orders-side-copy strong{font:700 14px/1.05 Georgia,"Times New Roman",serif;color:#ffe7a3;letter-spacing:.04em;white-space:nowrap}
.orders-side-copy span{margin-top:3px;color:#d8b75f;font-size:6px;font-weight:800;text-transform:uppercase;letter-spacing:.85px}
.orders-side-profile{
 display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;padding:8px;
 border:1px solid rgba(237,203,120,.20);border-radius:10px;background:rgba(255,249,229,.06)
}
.orders-side-avatar{
 display:grid;place-items:center;width:38px;height:38px;overflow:hidden;border-radius:50%;
 border:1px solid rgba(244,211,128,.48);background:#7b2330;color:#ffe9a9;font:700 15px/1 Georgia,"Times New Roman",serif
}
.orders-side-avatar img{width:100%;height:100%;object-fit:cover}
.orders-side-profile-copy{min-width:0}
.orders-side-profile-copy b{display:block;color:#fff6e5;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orders-side-profile-copy span{display:block;color:#d7c5a8;font-size:7px;text-transform:uppercase;letter-spacing:.65px;margin-top:2px}
.orders-side-signout{
 width:100%;min-height:33px!important;padding:5px 8px!important;background:rgba(255,255,255,.045)!important;
 color:#f4ddb0!important;border-color:rgba(237,204,123,.18)!important;font-size:9px!important
}

/* premium header */
.orders-head{
 position:relative;overflow:hidden;display:grid!important;grid-template-columns:minmax(0,1fr) auto;
 align-items:center!important;gap:14px;flex:0 0 auto!important;margin:0 0 7px!important;padding:11px 13px;
 border:1px solid #e3d3b2;border-radius:12px;background:linear-gradient(135deg,#fffaf0,#fffdf8 62%,#f5e8cd)
}
.orders-head:after{
 content:"";position:absolute;right:-76px;top:-118px;width:245px;height:245px;border-radius:50%;
 border:1px solid rgba(200,148,45,.13);box-shadow:0 0 0 23px rgba(200,148,45,.022),0 0 0 46px rgba(200,148,45,.015)
}
.orders-head>div{position:relative;z-index:2}
.orders-head h1{margin:0!important;font:700 27px/1.03 Georgia,"Times New Roman",serif!important;color:#430a11!important}
.orders-head p{margin:4px 0 0!important;color:#75675e!important;font-size:8px!important}
.head-actions{gap:5px!important}.head-actions button{min-height:33px!important;padding:5px 8px!important;font-size:8px!important}

/* KPIs */
.summary-strip{
 flex:0 0 auto!important;grid-template-columns:repeat(7,minmax(80px,1fr))!important;gap:5px!important;margin-bottom:6px!important
}
.summary-box{
 min-height:58px!important;padding:7px 8px!important;border-radius:9px!important;
 background:#fffdf8!important;border-color:#e6dbc5!important;box-shadow:none!important;position:relative;overflow:hidden
}
.summary-box:after{content:"";position:absolute;right:-22px;bottom:-31px;width:64px;height:64px;border:1px solid rgba(200,148,45,.10);border-radius:50%}
.summary-box span{font-size:5.8px!important;color:#75675d!important}
.summary-box strong{font:700 15px/1 Georgia,"Times New Roman",serif!important;color:#430a11!important;margin-top:4px!important}
.summary-box.active{outline:1px solid #c8942d!important;background:#fff4d1!important}
.summary-box.warn{background:#fff4df!important}
.summary-box.good{background:#f8efd8!important}
.summary-box.bad{background:#fff0ec!important}

/* filters + register */
.filters{
 flex:0 0 auto!important;position:relative!important;top:auto!important;z-index:20!important;
 margin-bottom:5px!important;padding:7px!important;border:1px solid #e4dbc8!important;border-radius:9px!important;
 background:#fffdf8!important;backdrop-filter:none!important
}
.filter-row{gap:5px!important}.filter-row label{font-size:7px!important;color:#66574d!important}
.filter-row input,.filter-row select{min-height:33px!important;padding:5px 7px!important;font-size:9px!important;border-radius:7px!important;border-color:#ddcfb4!important;background:#fffefa!important}
.filter-buttons button{min-height:33px!important;font-size:8px!important;padding:4px 7px!important}
.quick-row{margin-top:5px!important;gap:4px!important}.chip{min-height:27px!important;padding:4px 7px!important;font-size:7px!important}
.chip.on{background:#68141d!important;border-color:#68141d!important;color:#fff0cc!important}
#count{flex:0 0 auto;margin:2px 2px 5px!important;font-size:7px!important;color:#81746a!important}
.smart-workspace{display:flex!important;flex-direction:column!important;flex:1 1 auto!important;min-height:0!important}
.sheet{
 flex:1 1 auto!important;min-height:0!important;overflow:auto!important;border-color:#dfd3bc!important;border-radius:9px!important;background:#fffdf8!important
}
.order-table th{background:#f5ecd9!important;color:#6f5b4b!important}
.order-table tbody tr:hover td{background:#fff7e8!important}
.oid{color:#68141d!important}
.view-btn{background:#68141d!important;border-color:#68141d!important;color:#fff0cf!important}
.print-btn{background:#fff4d6!important;color:#6e511e!important;border-color:#e3ca8b!important}
.payment-pill{background:#f4ead5!important;color:#684e2e!important}

/* status remains distinct but harmonised */
.st-placed{background:#fff0cf!important;color:#855714!important}
.st-confirmed{background:#f4e5e8!important;color:#762933!important}
.st-packed{background:#eee7f4!important;color:#624f79!important}
.st-dispatched{background:#f8e5cc!important;color:#875218!important}
.st-delivered{background:#e7efe5!important;color:#3a6b4a!important}
.st-cancelled{background:#fff0ec!important;color:#9c3d31!important}

/* sheet mode */
.workspace-bar,.sheet-bar{background:#68141d!important;color:#fff3d5!important}
.workspace-title span,.workspace-bar small{color:#e8d1a0!important}
.smart-workspace.fullscreen-sheet{background:#fbf7ee!important}
.smart-workspace.fullscreen-sheet .filters{background:#fffdf8!important}
.smart-workspace.fullscreen-sheet .order-table th{background:#efe1c4!important}

/* modal */
.full-modal,.small-modal{
 background:#fffdf8!important;border:1px solid #dcca9e!important;
 box-shadow:0 30px 100px rgba(67,10,17,.32)!important
}
.full-modal::backdrop,.small-modal::backdrop{background:rgba(48,8,13,.68)!important;backdrop-filter:blur(2px)}
.modal-head,.small-foot{background:#fffaf0!important;border-color:#e7dcc4!important}
.modal-head h2{font-family:Georgia,"Times New Roman",serif!important;color:#430a11!important}
.detail-layout .card,.journey-card{border-color:#e6dbc5!important;background:#fffdf8!important}
.hero{background:linear-gradient(135deg,#68141d,#812531)!important;color:#fff6e3!important}
.hero strong,.hero b{color:#ffe3a0!important}
.payment-record-card{background:#fff5d9!important}.payment-record-card strong{color:#68141d!important}

/* ========= fixed journey / truck ========= */
.journey-card{
 overflow:visible!important;
 background:linear-gradient(180deg,#fffaf0,#f8eedb)!important;
 padding-top:12px!important
}
.journey{
 position:relative!important;
 padding:34px 14px 12px!important;
 overflow:visible!important
}
.journey-route{
 position:absolute!important;
 left:10%!important;right:10%!important;top:42px!important;height:5px!important;
 z-index:2!important;overflow:visible!important
}
.journey-road{
 position:absolute!important;inset:0!important;z-index:1!important;border-radius:999px!important;
 background:linear-gradient(90deg,#c8942d 0 var(--progress),#e4d8c1 var(--progress) 100%)!important
}
.journey-road:after{top:2px!important;border-top:1px dashed rgba(255,255,255,.9)!important}
.journey-steps{position:relative!important;z-index:5!important}
.jdot{
 position:relative!important;z-index:6!important;width:21px!important;height:21px!important;
 border-color:#dbcdaF!important;background:#fffdf8!important
}
.jstep.done .jdot,.jstep.current .jdot{background:#68141d!important;border-color:#68141d!important}
.jstep.current .jdot{box-shadow:0 0 0 5px #f4dfaa!important}
.jstep span{margin-top:8px!important;color:#7b6d62!important}
.jstep.done span,.jstep.current span{color:#68141d!important}
.journey-truck{
 position:absolute!important;

function statusConflictError(err){
 const m=String(err?.message||err||'').toLowerCase();
 const c=String(err?.code||'').toLowerCase();
 return c.includes('version')||
        m.includes('version_conflict')||
        m.includes('record changed')||
        m.includes('409')||
        m.includes('conflict');
}
function genericDatabaseConflict(err){
 return Number(err?.status)===409 &&
        /database operation failed|request failed/i.test(String(err?.message||''));
}
async function directOrderRow(id){
 // Preferred source: the actual row/version. If RLS does not expose the table
 // directly to admins, silently fall back to the secure Orders API.
 try{
  const {data,error}=await A.client
   .from('orders')
   .select('id,status,version,tracking,updated_at')
   .eq('id',id)
   .maybeSingle();
  if(!error&&data&&Number.isInteger(Number(data.version))){
   return {...data,version:Number(data.version)};
  }
 }catch{}
 return null;
}
async function freshOrderState(id){
 const direct=await directOrderRow(id);
 if(direct)return direct;

 const fresh=await A.all('orders.list',{});
 const live=fresh.find(x=>+x.id===+id);
 if(!live)throw Error(`Order #ON${id} is no longer available.`);

 const version=Number(live.version);
 if(!Number.isInteger(version)){
  // Do not send a malformed expected_version to PostgreSQL. A malformed
  // integer is one cause of a generic 409 / "Database operation failed".
  throw Error(
   `Order #ON${id} could not expose its current version. `+
   `Refresh the page once before changing status.`
  );
 }
 return {...live,version};
}
function statusPayload(live,next,fd){
 const reason=next==='cancelled'
   ?[fd.get('reason'),fd.get('other')].filter(Boolean).join(' · ')
   :undefined;
 const version=Number(live.version);
 if(!Number.isInteger(version))throw Error('Current order version is unavailable.');
 return {
  id:Number(live.id),
  status:String(next),
  expected_version:version,
  ...(next==='dispatched'?{tracking:String(fd.get('tracking')||live.tracking||'')}:{}),
  ...(reason?{reason}:{}),
  note:String(fd.get('note')||'')
 };
}
async function diagnosticStatusRpc(payload){
 // Used only after the Edge Function returns a generic 409. It lets PostgREST
 // expose the actual database rule/message when the authenticated role is
 // permitted to call the public wrapper. It never bypasses order permissions.
 try{
  const {data:{session}}=await A.client.auth.getSession();
  if(!session?.user?.id)return null;
  const parts=String(session.access_token||'').split('.');
  if(parts.length<2)return null;
  const raw=parts[1].replace(/-/g,'+').replace(/_/g,'/');
  const claims=JSON.parse(decodeURIComponent(escape(atob(raw+'='.repeat((4-raw.length%4)%4)))));
  if(!claims.session_id)return null;
  const {data,error}=await A.client.rpc('oneness_api',{
   p_uid:session.user.id,
   p_sid:claims.session_id,
   p_action:'order.status',
   p_data:payload
  });
  if(error)return {error};
  return {data};
 }catch{return null}
}
async function sendStatusUpdate(live,next,fd){
 const payload=statusPayload(live,next,fd);
 try{
  return await A.api('order.status',payload,{request_id:crypto.randomUUID()});
 }catch(err){
  // Generic 409s hide the useful PostgreSQL message in the Edge Function.
  // Attempt a secure diagnostic call so the UI can show the real rule.
  if(genericDatabaseConflict(err)){
   const diag=await diagnosticStatusRpc(payload);
   if(diag?.data)return diag.data;
   if(diag?.error?.message){
    const e=Error(diag.error.message);
    e.code=diag.error.code;
    e.status=409;
    throw e;
   }
  }
  throw err;
 }
}
async function updateOrderStatusSmart(id,next,fd){
 let live=await freshOrderState(id);

 if(live.status===next)return live;

 if(!validNext(live.status).includes(next)){
  throw Error(
   `Order #ON${id} is currently ${statusLabel(live.status)}. `+
   `${statusLabel(next)} is not available from the current status.`
  );
 }

 for(let attempt=0;attempt<3;attempt++){
  try{
   return await sendStatusUpdate(live,next,fd);
  }catch(err){
   const retryable=statusConflictError(err)||genericDatabaseConflict(err);
   if(!retryable||attempt===2)throw err;

   await new Promise(resolve=>setTimeout(resolve,140*(attempt+1)));
   const newer=await freshOrderState(id);

   if(newer.status===next)return newer;

   if(!validNext(newer.status).includes(next)){
    throw Error(
     `Order #ON${id} changed to ${statusLabel(newer.status)} while this page was open. `+
     `The order list has been refreshed.`
    );
   }

   // Retry only with a newly-read authoritative version.
   if(Number(newer.version)===Number(live.version) && genericDatabaseConflict(err)){
    // Same version + generic 409 means this is not a stale-row problem.
    throw Error(
     `The database rejected the ${statusLabel(next)} transition for #ON${id}. `+
     `The order is still ${statusLabel(newer.status)}.`
    );
   }
   live=newer;
  }
 }
}

 if(mode==='now')return {recorded_at_mode:'now'};
 let day='';
 if(mode==='today')day=istDayOffset(0);
 else if(mode==='yesterday')day=istDayOffset(-1);
 else day=String(fd.get('pay_date')||'').trim();
 const time=String(fd.get('pay_time')||'').trim();
 if(!day||!time)throw Error('Choose a valid payment day and time.');
 return {recorded_at:`${day}T${time}:00+05:30`};
}
function wirePaymentTimeUI(existing){
 const modeInput=document.querySelector('[name="time_mode"]');
 const detail=$('payment-time-detail'),custom=$('payment-custom-date'),preview=$('payment-time-preview');
 const timeSelect=document.querySelector('[name="pay_time"]');
 const dateInput=document.querySelector('[name="pay_date"]');
 const setMode=mode=>{
  modeInput.value=mode;
  for(const b of document.querySelectorAll('[data-pay-time-mode]'))b.classList.toggle('active',b.dataset.payTimeMode===mode);
  detail.hidden=['now','keep'].includes(mode);
  custom.hidden=mode!=='custom';
  if(mode==='today')preview.textContent=`Today · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='yesterday')preview.textContent=`Yesterday · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='custom')preview.textContent=`${dateInput.value||'Choose date'} · ${timeSelect.selectedOptions[0]?.textContent||''}`;
  else if(mode==='keep')preview.textContent='Existing payment time will stay unchanged';
  else preview.textContent='Server will record the current time automatically';
 };
 for(const b of document.querySelectorAll('[data-pay-time-mode]'))b.onclick=()=>setMode(b.dataset.payTimeMode);
 timeSelect.onchange=()=>setMode(modeInput.value);
 dateInput.onchange=()=>setMode(modeInput.value);
 setMode(existing?'keep':'now');
}

function suggestionCandidates(){
 const map=new Map(),add=(type,value,label=value)=>{const v=String(value||'').trim();if(!v)return;const key=(type+'|'+v).toLowerCase();if(!map.has(key))map.set(key,{type,value:v,label:String(label||v)})};
 for(const o of orders){
  add('Order',`ON${o.id}`,`#ON${o.id}`);
  add('Shop',o.business_name);
  add('Retailer',o.customer_name);
  if(contactOK)add('Mobile',o.customer_phone);
  add('Tracking',o.tracking);
  add('PIN',o.delivery_pincode);
  add('City',o.delivery_city);
  add('Payment ref',o.payment_reference);
  for(const p of o.product_titles||[])add('Product',p);
 }
 return [...map.values()]
}
function renderSuggestions(){
 const box=$('search-suggest');if(!box)return;
 const q=$('search').value.trim().toLowerCase();
 if(!q){box.hidden=true;box.innerHTML='';return}
 const rows=suggestionCandidates().filter(x=>`${x.value} ${x.label}`.toLowerCase().includes(q)).sort((a,b)=>{
  const aa=a.value.toLowerCase().startsWith(q)?0:1,bb=b.value.toLowerCase().startsWith(q)?0:1;return aa-bb||a.label.localeCompare(b.label)
 }).slice(0,9);
 if(!rows.length){box.hidden=true;box.innerHTML='';return}
 box.innerHTML=rows.map(x=>`<button type="button" data-suggest="${esc(x.value)}"><span class="suggest-type">${esc(x.type)}</span><span class="suggest-text">${esc(x.label)}</span></button>`).join('');
 box.hidden=false;
 for(const b of box.querySelectorAll('[data-suggest]'))b.onclick=()=>{$('search').value=b.dataset.suggest;box.hidden=true;page=1;render()}
}
async function detail(id){return await A.api('order.details',{id})}
function journey(status){
 if(status==='cancelled')return `<div class="cancel-journey">● Order cancelled — fulfilment journey stopped.</div>`;
 const steps=['placed','confirmed','packed','dispatched','delivered'],idx=steps.indexOf(status),safe=Math.max(0,idx),progress=idx<0?0:(safe/(steps.length-1))*100;
 const truck=`<svg viewBox="0 0 64 40" role="img" aria-label="Delivery truck"><rect x="2" y="7" width="37" height="21" rx="4" fill="#68141d"/><path d="M39 13h10l11 10v5H39z" fill="#8a2935"/><path d="M44 15h5l7 7H44z" fill="#f4dfaa"/><rect x="7" y="11" width="22" height="3" rx="1.5" fill="#d6a63f"/><path d="M9 19h20" stroke="#c8942d" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="31" r="6" fill="#430a11"/><circle cx="49" cy="31" r="6" fill="#430a11"/><circle cx="16" cy="31" r="2.4" fill="#e6c56f"/><circle cx="49" cy="31" r="2.4" fill="#e6c56f"/></svg>`;
 return `<div class="journey"><div class="journey-route" style="--progress:${progress}%;--truck:${progress}%"><div class="journey-road"></div><div class="journey-truck" aria-hidden="true">${truck}</div></div><div class="journey-steps">${steps.map((s,i)=>`<div class="jstep ${i<safe?'done':i===safe&&idx>=0?'current':''}"><div class="jdot"></div><span>${esc(statusLabel(s))}</span></div>`).join('')}</div></div>`;
}
