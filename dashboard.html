<style>
:root{--wine:#68141d;--wine-dark:#430a11;--wine-mid:#812531;--gold:#c8942d;--gold2:#e5bb54;--cream:#f7efdd;--paper:#fbf7ee;--ivory:#fffaf0;--ink:#2b211c;--muted:#776b61;--line:#e7dcc4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fbf7ee;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:
radial-gradient(circle at 50% 42%,rgba(229,187,84,.13),transparent 31%),#fbf7ee}
.boot-wrap{display:grid;justify-items:center;gap:10px}
.boot-logo{width:70px;height:44px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(104,20,29,.12))}
.infinity-loader-svg{width:94px;height:54px;overflow:visible;filter:drop-shadow(0 7px 15px rgba(104,20,29,.12))}
.infinity-loader-svg .base{fill:none;stroke:#ead9aa;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.infinity-loader-svg .flow{fill:none;stroke:url(#loaderGold);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:infinityDraw 1.55s cubic-bezier(.65,0,.35,1) infinite}
.infinity-loader-svg .shine{fill:none;stroke:#fff6ce;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:infinityDraw 1.55s cubic-bezier(.65,0,.35,1) infinite;opacity:.82}
@keyframes infinityDraw{0%{stroke-dashoffset:1;opacity:.38}44%{stroke-dashoffset:0;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1;opacity:.32}}
.boot-word{font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.17em;color:#68141d}
.boot-sub{font-size:7px;font-weight:850;letter-spacing:.19em;text-transform:uppercase;color:#987837}
.page-transition{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(251,247,238,.95);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:.14s ease}
.page-transition.show{opacity:1;visibility:visible}
</style>
</head>

function upgradeSharedShell(){
 const sideBrand=document.querySelector('.side .brand');
 if(sideBrand){
  sideBrand.innerHTML=`<img class="side-logo" src="${LOGO}" alt="ONeness Group"><span class="side-brand-copy"><strong>ONENESS GROUP</strong><span>Lakhpati Didi Program</span></span>`;
 }
 const bottom=document.querySelector('.side .bottom');
 const logout=document.getElementById('logout');
 if(bottom){
  const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
  const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="">`:esc(initial);
  bottom.innerHTML=`<div class="dash-profile"><div class="dash-avatar">${avatar}</div><div class="dash-profile-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div>`;
  if(logout){
   logout.className='dash-signout';
   bottom.append(logout);
  }
 }
}
upgradeSharedShell();

  settings:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5l-.4 3.1a8 8 0 0 0-1.7 1L5 6.1 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 3.1h5l.4-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>`,
  more:`<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>`
 };
 return icons[name]||icons.more;
}

function buildMobileChrome(){
 const all=[...document.querySelectorAll('.side nav a')].map(a=>({
  href:a.getAttribute('href'),label:a.textContent.trim(),active:a.classList.contains('active')
 }));
 const key=x=>String(x.href||'').replace('.html','');
 const preferred=['dashboard','products','orders','payments'];
 const primary=[];
 for(const k of preferred){
  const found=all.find(x=>key(x)===k);
  if(found&&!primary.includes(found))primary.push(found);
 }
 for(const item of all){
  if(primary.length>=4)break;
  if(!primary.includes(item)&&key(item)!=='settings')primary.push(item);
 }
 const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
 const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="">`:esc(initial);

 const top=document.createElement('header');
 top.className='mobile-appbar';
 top.innerHTML=`<div class="mobile-brand"><img src="${LOGO}" alt="ONeness"><span class="mobile-brand-copy"><b>ONENESS GROUP</b><span>Lakhpati Didi Program</span></span></div><button id="mobile-profile" class="mobile-avatar-button" aria-label="Open account menu">${avatar}</button>`;
 document.body.append(top);

 const nav=document.createElement('nav');
 nav.className='mobile-bottom-nav';
 nav.innerHTML=primary.map(x=>`<a class="mobile-nav-item ${x.active?'active':''}" href="${esc(x.href)}">${icon(key(x))}<span>${esc(x.label)}</span></a>`).join('')+`<button class="mobile-nav-item more" id="mobile-more">${icon('more')}<span>More</span></button>`;
 document.body.append(nav);

 const backdrop=document.createElement('div');
 backdrop.className='mobile-sheet-backdrop';
 backdrop.id='mobile-sheet-backdrop';
 document.body.append(backdrop);

 const more=document.createElement('section');
 more.className='mobile-more-sheet';
 more.id='mobile-more-sheet';
 more.innerHTML=`<div class="mobile-more-profile"><div class="mobile-more-avatar">${avatar}</div><div class="mobile-more-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div><div class="mobile-more-links">${all.map(x=>`<a class="${x.active?'active':''}" href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div><button id="mobile-signout" class="mobile-more-signout">Sign out</button>`;
 document.body.append(more);

 const openMore=()=>{more.classList.add('open');backdrop.classList.add('show')};
 const closeSheets=()=>{more.classList.remove('open');document.getElementById('dashboard-filterbar')?.classList.remove('open');backdrop.classList.remove('show')};
 document.getElementById('mobile-more').onclick=openMore;
 document.getElementById('mobile-profile').onclick=openMore;
 document.getElementById('mobile-signout').onclick=()=>document.getElementById('logout')?.click();
 backdrop.onclick=closeSheets;
 window.__closeDashboardSheets=closeSheets;
}
buildMobileChrome();

$('view').innerHTML=`
<section class="dashboard-head">
 <img class="dashboard-mark" src="${LOGO}" alt="" aria-hidden="true">
 <div class="dashboard-title">
  <div class="dashboard-kicker">ONeness Group · Overview</div>
  <h1>Your trade, at a glance</h1>
  <p>Orders, collections and the items that need your attention today.</p>
 </div>
 <div class="dashboard-actions">
  <a class="button primary" href="${A.profile.role==='retailer'?'products':'orders'}.html">${A.profile.role==='retailer'?'Browse products':'Manage orders'} →</a>
  <button id="mobile-filter-toggle" class="mobile-filter-button" aria-label="Open date filters">⌁</button>
 </div>
</section>

<div id="dashboard-filterbar" class="dashboard-filterbar">${A.dateFields()}<div></div><button id="refresh">Refresh overview</button></div>
<p id="progress" class="dashboard-progress">Loading your overview…</p>
<div id="numbers"></div>

<div class="dashboard-tabs">

</div>

  <div id="recent" class="dashboard-panel-body"></div>
 </section>
 <section class="card dashboard-panel" data-mobile-panel="attention">
  <div class="dashboard-panel-head"><h2>Needs attention</h2><span class="muted">Operational checks</span></div>
  <div id="attention" class="dashboard-panel-body"></div>
 </section>
</div>`;

const filterbar=$('dashboard-filterbar'),backdrop=document.getElementById('mobile-sheet-backdrop');
$('mobile-filter-toggle').onclick=()=>{
 window.__closeDashboardSheets?.();
 filterbar.classList.add('open');
 backdrop.classList.add('show');
};
for(const b of document.querySelectorAll('[data-dashboard-tab]'))b.onclick=()=>{
 for(const x of document.querySelectorAll('[data-dashboard-tab]'))x.classList.toggle('active',x===b);
 for(const panel of document.querySelectorAll('[data-mobile-panel]'))panel.classList.toggle('mobile-active',panel.dataset.mobilePanel===b.dataset.dashboardTab);
};

let orders=[],products=[],users=[];
const readable=A.profile.role==='retailer'||A.can('orders');

async function load(){
 try{
  $('refresh').disabled=true;
  if(readable)orders=await A.all('orders.list',{},n=>$('progress').textContent=`Loaded ${n} orders…`);
  if(A.can('catalog'))products=await A.all('products.list');
  if(A.can('users'))users=await A.all('admin.users');
  $('progress').textContent='Updated '+A.date(new Date());
  render();
 }catch(e){
  A.error(e);$('progress').textContent=e.message;
 }finally{$('refresh').disabled=false}
}

function render(){
 try{
  const r=A.range(),selected=orders.filter(o=>A.inRange(o.created_at,r));
  const financial=A.profile.role==='retailer'||A.can('finance');
  const collected=orders.filter(o=>o.payment_status==='collected'&&A.inRange(o.collected_at,r)).reduce((n,o)=>n+o.total_paise,0);
  const outstanding=orders.filter(o=>o.status==='delivered'&&o.payment_status==='unpaid').reduce((n,o)=>n+o.total_paise,0);
  const metrics=[
   ['Orders received',selected.length,'Selected period'],
   ['Active orders',orders.filter(o=>['placed','confirmed','packed','dispatched'].includes(o.status)).length,'Current']
  ];
  if(financial&&readable)metrics.push(
   ['Collected',money(collected),'Payment date'],
   ['Outstanding',money(outstanding),'Delivered / unpaid']
  );
  $('numbers').innerHTML=A.cards(metrics);

  const mobile=matchMedia('(max-width:850px)').matches;
  const recentLimit=mobile?4:8;
  $('recent').innerHTML=A.table(
   ['Order','Date','Status'],
   selected.slice(0,recentLimit).map(o=>[
    `<a href="orders.html?id=${o.id}">#ON${o.id}</a>`,
    esc(A.date(o.created_at)),
    A.badge(o.status)
   ])
  );

  const bits=[];
  if(A.profile.status==='pending')bits.push(['Your account is awaiting approval.',true]);
  bits.push([`${orders.filter(o=>o.status==='syncing').length} orders are still saving.`,true]);
  if(A.can('orders'))bits.push([`${orders.filter(o=>o.status==='placed').length} orders need confirmation.`,true]);
  if(A.can('users'))bits.push([`${users.filter(u=>u.status==='pending').length} retailer accounts need approval.`,false]);
  if(A.can('catalog'))bits.push([`${products.filter(p=>p.active&&Number(p.stock)<=Number(p.low_stock_alert_qty??10)).length} products are at or below their low-stock alert.`,false]);

  $('attention').innerHTML=bits.length
   ?`<div class="attention-list">${bits.slice(0,mobile?5:8).map(([b,urgent])=>`<div class="attention-item ${urgent?'urgent':''}"><span class="attention-dot"></span><span>${esc(b)}</span></div>`).join('')}</div>`
   :'<div class="empty">Nothing needs attention right now.</div>';

  if(mobile && metrics.length<4){
   document.querySelector('#numbers>.grid')?.style.setProperty('grid-template-rows','1fr');
  }
 }catch(e){A.error(e)}
}

A.wireDates(()=>{render();window.__closeDashboardSheets?.()});
$('refresh').onclick=async()=>{await load();window.__closeDashboardSheets?.()};

const transition=document.createElement('div');
transition.className='page-transition';
transition.innerHTML=`<div class="boot-wrap"><img class="boot-logo" src="${LOGO}" alt=""><svg class="infinity-loader-svg" viewBox="0 0 100 58" aria-hidden="true"><defs><linearGradient id="pageGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a56e15"/><stop offset=".46" stop-color="#f0cf72"/><stop offset="1" stop-color="#b77b1c"/></linearGradient></defs><path pathLength="1" class="base" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="flow" style="stroke:url(#pageGold)" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="shine" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/></svg><div class="boot-sub">Opening page</div></div>`;
document.body.append(transition);

document.addEventListener('click',e=>{
 const a=e.target.closest('a[href]');
 if(!a||a.target==='_blank'||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
 let u;try{u=new URL(a.href,location.href)}catch{return}
 if(u.origin===location.origin&&u.pathname!==location.pathname)transition.classList.add('show');
});

for(const href of [...document.querySelectorAll('a[href]')].map(a=>a.href)){
 try{
  const u=new URL(href,location.href);
  if(u.origin===location.origin&&u.pathname.endsWith('.html')){
   const l=document.createElement('link');l.rel='prefetch';l.href=u.href;document.head.append(l);
  }
 }catch{}
}

await load();
})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
