<style>
:root{
 --wine:#68141d;--wine-dark:#430a11;--wine-mid:#812531;
 --gold:#c8942d;--gold2:#e5bb54;--paper:#fbf7ee;--surface:#fffdf8;
 --cream:#fffaf0;--line:#e6dac4;--ink:#2b211c;--muted:#776b61;
 --success:#356b4b;--danger:#9f3c31;--warning:#8d611b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{color:var(--ink)}
#boot{
 position:fixed;inset:0;z-index:100000;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 42%,rgba(229,187,84,.13),transparent 31%),var(--paper)
}
.boot-wrap{display:grid;justify-items:center;gap:10px}
.boot-logo{width:74px;height:46px;object-fit:contain}
.inf{width:96px;height:56px;overflow:visible;filter:drop-shadow(0 6px 12px rgba(104,20,29,.12))}
.inf path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.inf .base{stroke:#ead9aa;stroke-width:6}
.inf .flow{stroke:url(#bootGold);stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:infDraw 1.55s cubic-bezier(.65,0,.35,1) infinite}
.inf .shine{stroke:#fff6ce;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:infDraw 1.55s cubic-bezier(.65,0,.35,1) infinite;opacity:.82}
@keyframes infDraw{0%{stroke-dashoffset:1;opacity:.35}44%{stroke-dashoffset:0;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1;opacity:.3}}
.boot-word{color:var(--wine);font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.14em}
.boot-sub{color:#987837;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>

<div id="app">

 .side .brand:before,.side .brand:after{display:none!important;content:none!important}
 .users-side-logo{display:block;width:40px;height:32px;object-fit:contain;flex:0 0 40px}
 .users-side-copy{display:grid;min-width:0}
 .users-side-copy strong{color:#ffe7a3;font:700 15px/1.05 Georgia,"Times New Roman",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .users-side-copy span{margin-top:3px;color:#d8b75f;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
 .users-side-profile{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;align-items:center;padding:8px;border:1px solid rgba(237,203,120,.18);border-radius:9px;background:rgba(255,249,229,.055);overflow:hidden}
 .users-side-avatar{display:grid;place-items:center;width:34px!important;min-width:34px!important;max-width:34px!important;height:34px!important;min-height:34px!important;max-height:34px!important;padding:0!important;border-radius:50%!important;overflow:hidden!important;background:#7b2330!important;color:#ffe9a9!important;font:700 14px/1 Georgia!important}
 .users-side-avatar img{display:block!important;width:34px!important;height:34px!important;object-fit:cover!important;border-radius:50%!important}
 .users-side-profile-copy{min-width:0;overflow:hidden}
 .users-side-profile-copy b{display:block;color:#fff6e5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .users-side-profile-copy span{display:block;margin-top:2px;color:#d7c5a8;font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .users-side-signout{width:100%;height:34px!important;min-height:34px!important;padding:5px 8px!important;background:rgba(255,255,255,.045)!important;border-color:rgba(237,204,123,.18)!important;color:#f4ddb0!important;font-size:11px!important}

 .users-head{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;margin-bottom:8px;padding:13px 15px;border:1px solid var(--ux-line);border-radius:11px;background:var(--ux-surface)}
 .users-kicker{margin-bottom:4px;color:var(--ux-wine);font-size:12px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}
 .users-head h1{margin:0;color:var(--ux-wine-dark);font:700 32px/1.05 Georgia,"Times New Roman",serif}
 .users-head p{margin:6px 0 0;color:var(--ux-muted);font-size:14px;line-height:1.45}
 .users-head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

 .users-summary{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px}
 .users-summary-card{min-width:0;padding:11px 12px;border:1px solid var(--ux-line);border-radius:9px;background:var(--ux-surface)}
 .users-summary-card span{display:block;color:#7b6d63;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.45px}
 .users-summary-card strong{display:block;margin-top:4px;color:var(--ux-wine-dark);font:700 22px/1 Georgia,"Times New Roman",serif}
 .users-summary-card.pending{background:#fff5df}
 .users-summary-card.active{background:#f4f0df}
 .users-summary-card.blocked{background:#fff1ed}

 .users-filterbar{flex:0 0 auto;display:grid;grid-template-columns:minmax(220px,1.6fr) 165px 145px 145px 155px;gap:8px;align-items:end;margin-bottom:6px;padding:9px;border:1px solid var(--ux-line);border-radius:9px;background:var(--ux-surface)}
 .users-filterbar label{min-width:0;margin:0;color:#5e5148;font-size:12px;font-weight:750}
 .users-filterbar input,.users-filterbar select{min-height:40px!important;padding:8px 10px!important;font-size:14px!important}
 .users-count{flex:0 0 auto;height:24px;margin:0 2px 5px!important;color:#776b61!important;font-size:13px!important;line-height:24px}

 .users-list-wrap{flex:1 1 auto;min-height:0;overflow:hidden}
 .users-table-wrap{height:100%;overflow:auto;border:1px solid var(--ux-line);border-radius:9px;background:var(--ux-surface)}
 .users-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}

 .users-table tbody tr:nth-child(even) td{background:#fffbf4}
 .users-table tbody tr:hover td{background:#fff6e4}

 .users-table th:nth-child(3){width:12%}

 .users-table th:nth-child(5){width:11%}
 .users-table th:nth-child(6){width:12%}
 .partner-name{display:block;color:#4a171b;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .partner-meta{display:block;margin-top:4px;color:#7d7066;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .contact-main{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .contact-sub{display:block;margin-top:4px;color:#7d7066;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .users-table .badge{font-size:11px!important;padding:5px 8px!important}
 .cod-pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3ead7;color:#6f5835;font-size:11px;font-weight:800}

 .manage-btn{width:100%;min-height:36px!important;padding:6px 8px!important;background:var(--ux-wine)!important;border-color:var(--ux-wine)!important;color:#fff0ce!important;font-size:12px!important}

 .users-pager{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:7px}
 .users-pager button{min-height:36px!important;padding:6px 10px!important;font-size:12px!important}

 dialog label{font-size:13px!important}
 dialog input,dialog select,dialog textarea{font-size:15px!important}
 dialog .card{font-size:14px!important}
 dialog h2,dialog h3{font-size:21px!important}

  if(bottom){
   const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
   const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="Profile photo" onerror="this.remove();this.parentElement.textContent='${esc(initial)}'">`:esc(initial);
   bottom.innerHTML=`<div class="users-side-profile"><div class="users-side-avatar">${avatar}</div><div class="users-side-profile-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div>`;
   if(logout){logout.className='users-side-signout';bottom.append(logout)}
  }
 }

 function buildMobileChrome(){
  const links=[...document.querySelectorAll('.side nav a')].map(a=>({href:a.getAttribute('href'),label:a.textContent.trim(),active:a.classList.contains('active')}));
  const key=x=>String(x.href||'').replace('.html','');
  const preferred=['dashboard','products','orders','users'],primary=[];
  for(const k of preferred){const x=links.find(v=>key(v)===k);if(x&&!primary.includes(x))primary.push(x)}
  for(const x of links){if(primary.length>=4)break;if(!primary.includes(x)&&key(x)!=='settings')primary.push(x)}
  const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
  const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="Profile photo" onerror="this.remove();this.parentElement.textContent='${esc(initial)}'">`:esc(initial);

  const bar=document.createElement('header');
  bar.className='users-mobile-appbar';
  bar.innerHTML=`<div class="users-mobile-brand"><img src="${ONENESS_MARK}" alt="ONeness"><span class="users-mobile-brand-copy"><b>ONENESS GROUP</b><span>Users & Accounts</span></span></div><div class="users-mobile-actions"><button id="users-mobile-filter" class="users-mobile-icon" aria-label="Filters">⌁</button><button id="users-mobile-profile" class="users-mobile-icon users-mobile-avatar" aria-label="Account">${avatar}</button></div>`;
  document.body.append(bar);

  const nav=document.createElement('nav');
  nav.className='users-mobile-bottom';
  nav.innerHTML=primary.map(x=>`<a class="users-mobile-nav ${x.active?'active':''}" href="${esc(x.href)}">${icon(key(x))}<span>${esc(x.label)}</span></a>`).join('')+`<button id="users-mobile-more-btn" class="users-mobile-nav more">${icon('more')}<span>More</span></button>`;
  document.body.append(nav);

  const backdrop=document.createElement('div');
  backdrop.className='users-mobile-backdrop';backdrop.id='users-mobile-backdrop';document.body.append(backdrop);

  const more=document.createElement('section');
  more.className='users-mobile-more';more.id='users-mobile-more';
  more.innerHTML=`<div class="users-more-profile"><div class="users-more-avatar">${avatar}</div><div class="users-more-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div><div class="users-more-links">${links.map(x=>`<a class="${x.active?'active':''}" href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div><button id="users-mobile-signout" class="users-more-signout">Sign out</button>`;
  document.body.append(more);

  const close=()=>{more.classList.remove('open');document.querySelector('.users-filterbar')?.classList.remove('mobile-open');backdrop.classList.remove('show')};
  const openMore=()=>{close();more.classList.add('open');backdrop.classList.add('show')};
  const openFilter=()=>{close();document.querySelector('.users-filterbar')?.classList.add('mobile-open');backdrop.classList.add('show')};

  document.getElementById('users-mobile-more-btn').onclick=openMore;
  document.getElementById('users-mobile-profile').onclick=openMore;
  document.getElementById('users-mobile-filter').onclick=openFilter;
  document.getElementById('users-mobile-signout').onclick=()=>document.getElementById('logout')?.click();
  backdrop.onclick=close;
  window.__closeUsersSheets=close;
 }

 upgradeShell();

 $('view').innerHTML=`
 <section class="users-head">
  <div>
   <div class="users-kicker">ONeness Group · Accounts</div>
   <h1>People & permissions</h1>
   <p>Approve retail partners, manage account access and control staff permissions.</p>
  </div>
  <div class="users-head-actions">
   <button id="refresh">Refresh</button>
   <button id="export" class="primary">Export CSV</button>
  </div>
 </section>
 <div id="users-summary" class="users-summary"></div>
 <section class="users-filterbar">
  <label>Search<input id="search" placeholder="Name, shop, email or phone"></label>
  <label>Account type<select id="type"><option value="retailer">Retailers</option><option value="staff">Admin staff</option><option value="">All accounts</option></select></label>
  ${A.dateFields()}
  <label>Status<select id="status"><option value="">All statuses</option><option>pending</option><option>active</option><option>blocked</option></select></label>
 </section>
 <p class="users-count" id="count"></p>
 <div class="users-list-wrap"><div id="list"></div></div>
 <div class="users-pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div>
 `;

 buildMobileChrome();

 $('from').value='';$('to').value='';$('period').value='all';

 async function load(){
  users=await A.all('admin.users');
  if(A.can('orders')&&A.can('finance'))orders=await A.all('orders.list');
  render();
 }

 function filtered(){
  const r=A.range();
  const q=$('search').value.toLowerCase(),t=$('type').value,s=$('status').value;
  return users.filter(u=>A.inRange(u.created_at,r)&&(`${u.id} ${u.name} ${u.business_name} ${u.email} ${u.phone}`).toLowerCase().includes(q)&&(!t||(t==='staff'?u.role!=='retailer':u.role==='retailer'))&&(!s||u.status===s));
 }

 function summary(){
  const all=filtered();
  $('users-summary').innerHTML=`
   <div class="users-summary-card"><span>Accounts</span><strong>${all.length}</strong></div>
   <div class="users-summary-card pending"><span>Pending</span><strong>${all.filter(u=>u.status==='pending').length}</strong></div>
   <div class="users-summary-card active"><span>Active</span><strong>${all.filter(u=>u.status==='active').length}</strong></div>
   <div class="users-summary-card blocked"><span>Blocked</span><strong>${all.filter(u=>u.status==='blocked').length}</strong></div>`;
 }

 function tableHtml(rows){
  if(!rows.length)return '<div class="empty">No accounts match the selected filters.</div>';
  return `<div class="users-table-wrap"><table class="users-table">
   <thead><tr><th>Partner</th><th>Contact</th><th>Role</th><th>Status</th><th>COD</th><th>Action</th></tr></thead>
   <tbody>${rows.map(u=>`<tr>
    <td><span class="partner-name">${esc(u.business_name||u.name||'Unnamed account')}</span><span class="partner-meta">#${u.id} · ${esc(u.name||'—')}</span></td>
    <td><span class="contact-main">${esc(u.email||'—')}</span><span class="contact-sub">${esc(u.phone||'—')}</span></td>
    <td>${A.badge(u.role)}</td>
    <td>${A.badge(u.status)}</td>
    <td><span class="cod-pill ${u.cod_allowed?'on':''}">${u.cod_allowed?'Allowed':'Disabled'}</span></td>
    <td><button data-open="${u.id}" class="manage-btn">Manage</button></td>
   </tr>`).join('')}</tbody>
  </table></div>`;
 }

 function render(){
  try{
   shown=filtered();
   const totalPages=Math.max(1,Math.ceil(shown.length/25));
   page=Math.max(1,Math.min(page,totalPages));
   const rows=shown.slice((page-1)*25,page*25);
   summary();
   $('count').textContent=`${shown.length} account${shown.length===1?'':'s'} · ${A.range().label}`;
   $('list').innerHTML=tableHtml(rows);
   $('page').textContent=`Page ${page} / ${totalPages}`;
   $('prev').disabled=page===1;
   $('next').disabled=page>=totalPages;
   for(const b of document.querySelectorAll('[data-open]'))b.onclick=()=>manage(users.find(u=>u.id===+b.dataset.open));
  }catch(e){A.error(e)}
 }

 function manage(u){
  const own=A.profile.role==='owner';
  if(!own&&u.role!=='retailer'){A.toast('Only the owner can manage staff accounts.');return}
  const fields=[['status','Account status','select',['pending','active','blocked']],['cod_allowed','Allow COD orders','checkbox']];
  if(own)fields.push(['role','Role','select',['retailer','admin','owner']],['permissions','Permissions, comma separated: catalog, orders, finance, users, settings, coupons, audit, notifications','textarea']);
  fields.push(['reason','Reason','text',[],true]);
  A.form('Manage '+(u.business_name||u.name||'#'+u.id),fields,{...u,permissions:u.permissions.join(', ')},async v=>{
   const data={id:u.id,expected_version:u.version,status:v.status,cod_allowed:v.cod_allowed,reason:v.reason};
   if(own){
    data.role=v.role;
    data.permissions=v.permissions.split(',').map(x=>x.trim()).filter(Boolean);
    if(data.permissions.some(p=>!['catalog','orders','finance','users','settings','coupons','audit','notifications'].includes(p)))throw Error('Unknown permission name.');
   }
   await A.api('admin.user.update',data);
   await load();
  });
  const extra=document.createElement('div');
  extra.style.marginTop='22px';
  const purchases=orders.filter(o=>o.user_id===u.id);
  if(A.can('orders')&&A.can('finance'))extra.innerHTML=A.cards([
   ['Delivered value',money(purchases.filter(o=>o.status==='delivered').reduce((n,o)=>n+o.total_paise,0))],
   ['Outstanding COD',money(purchases.filter(o=>o.status==='delivered'&&o.payment_status==='unpaid').reduce((n,o)=>n+o.total_paise,0))]
  ])+`<a class="button" href="orders.html">Open order history</a>`;
  if(A.can('audit')){
   const b=document.createElement('button');
   b.textContent='Activity log';
   b.onclick=()=>A.logs('user',u.id).catch(A.error);
   extra.append(b);
  }
  $('dialog-body').append(extra);
 }

 A.wireDates(()=>{page=1;render();window.__closeUsersSheets?.()});
 for(const id of ['search','type','status'])$(id).oninput=()=>{page=1;render()};
 $('prev').onclick=()=>{page--;render()};
 $('next').onclick=()=>{page++;render()};
 $('refresh').onclick=async()=>{try{await load();window.__closeUsersSheets?.()}catch(e){A.error(e)}};
 $('export').onclick=()=>{
  try{
   A.csv('Users',['ID','Name','Business','Email','Phone','Role','Status','COD allowed','Created IST'],filtered().map(u=>[u.id,u.name,u.business_name,u.email,u.phone,u.role,u.status,u.cod_allowed,A.date(u.created_at)]),'Accounts created '+A.range().label);
  }catch(e){A.error(e)}
 };
 await load();
})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body>
</html>
