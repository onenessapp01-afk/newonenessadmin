<style>
:root{
 --wine:#68141d;--wine-dark:#430a11;--wine-mid:#812531;
 --gold:#c8942d;--gold2:#e5bb54;--paper:#fbf7ee;--surface:#fffdf8;
 --cream:#fffaf0;--line:#e6dac4;--ink:#2b211c;--muted:#776b61;
 --success:#356b4b;--danger:#9f3c31;--warning:#8d611b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{color:var(--ink)}
#boot{
 position:fixed;inset:0;z-index:100000;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 42%,rgba(229,187,84,.13),transparent 31%),var(--paper)
}
.boot-wrap{display:grid;justify-items:center;gap:10px}
.boot-logo{width:74px;height:46px;object-fit:contain}
.inf{width:96px;height:56px;overflow:visible;filter:drop-shadow(0 6px 12px rgba(104,20,29,.12))}
.inf path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.inf .base{stroke:#ead9aa;stroke-width:6}
.inf .flow{stroke:url(#bootGold);stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:infDraw 1.55s cubic-bezier(.65,0,.35,1) infinite}
.inf .shine{stroke:#fff6ce;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:infDraw 1.55s cubic-bezier(.65,0,.35,1) infinite;opacity:.82}
@keyframes infDraw{0%{stroke-dashoffset:1;opacity:.35}44%{stroke-dashoffset:0;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1;opacity:.3}}
.boot-word{color:var(--wine);font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.14em}
.boot-sub{color:#987837;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>

<div id="app">

      <label>Agency status<select id="asm-status"><option value="all">All levels</option><option value="purchased">Ordered (green)</option><option value="pending">Not ordered (red)</option><option value="awaiting">Payment pending orders</option><option value="checking">Checking</option></select></label>
      <label>Orders<select id="asm-order-filter"><option value="all">All payments</option><option value="paid">Collected</option><option value="unpaid">Not collected</option><option value="cancelled">Cancelled</option><option value="agency">Matched agency orders</option><option value="unknown">Unclassified orders</option></select></label>
      <label class="asm-search">Find agency / order<input type="search" id="asm-search" placeholder="Level, order ID, product…"></label>
    </div>
    <div class="asm-note"><b>Rules:</b> Green = agency-level order placed, regardless of payment or delivery status. Red = no linked order in the selected date range. Order and payment statuses are shown separately. Levels match named packages or an exact chart investment amount; amount-only matches need verification. Collected sales exclude unpaid/cancelled orders.</div>
    <div id="asm-stats" class="asm-stats"></div>
    <main class="asm-main">
      <section class="asm-pane"><div class="asm-pane-title"><h3>Agency chart · all 11 levels</h3><span id="asm-level-count" class="asm-mini"></span></div><div class="asm-scroll"><table class="asm-grid" id="asm-grid"><thead><tr>
      <th>Agency / level</th><th>Placed?</th><th>Latest order status</th><th>Latest payment</th><th>Investment</th><th>Pouch rate</th><th>Pouch qty</th><th>Family pack</th><th>One-time bonus*</th><th>Incentive / target*</th><th>Duration*</th><th>Orders placed</th><th>Ordered value</th><th>Collected value</th>
      </tr></thead><tbody id="asm-level-rows"></tbody></table></div></section>
      <section class="asm-pane"><div class="asm-pane-title"><h3>Retailer & order ledger</h3><span id="asm-order-count" class="asm-mini"></span></div>
       <div class="asm-right-content"><section id="asm-user-card" class="asm-user-card"></section><section id="asm-focus" class="asm-focus-card"></section>
        <div id="asm-ledger-note" class="asm-list-meta"></div><div style="overflow:auto;max-height:280px;border:1px solid #e8ddcb;border-radius:6px"><table class="asm-orderlist"><thead><tr><th>Order</th><th>Date (IST)</th><th>Order status</th><th>Payment</th><th>Order total</th><th>Agency match</th><th>View</th></tr></thead><tbody id="asm-ledger"></tbody></table></div>
        <div id="asm-detail" hidden></div>
       </div></section>
    </main><footer class="asm-footer"><span id="asm-progress"></span><span>* Chart figures are supplied promotional reference values. No incentive is calculated or accrued by this page.</span></footer>`;
   const id=x=>document.getElementById(x);
   id('asm-back').onclick=asmClose;
   id('asm-jump').onclick=()=>root.querySelectorAll('.asm-pane')[1]?.scrollIntoView({behavior:'smooth',block:'start'});
   id('asm-reload').onclick=async()=>{const b=id('asm-reload');b.disabled=true;try{orders=await A.all('orders.list');asm.detailCache.clear();asm.scanned.clear();asm.failures.clear();asm.detailOpen=null;asmScanRestart();}catch(e){A.error(e);}finally{b.disabled=false;}};
   id('asm-user').onchange=e=>{asm.uid=Number(e.target.value);asm.selected='customer';asm.showAllOrders=true;asm.detailOpen=null;asmScanRestart();};
   id('asm-period').onchange=e=>{asmSetPeriod(e.target.value);asm.detailOpen=null;asmRender()};
   for(const field of ['from','to'])id('asm-'+field).onchange=e=>{asm[field]=e.target.value;asm.period='custom';asmRender()};
   id('asm-status').onchange=e=>{asm.status=e.target.value;asmRender()};
   id('asm-order-filter').onchange=e=>{asm.orderFilter=e.target.value;asmRender()};
   id('asm-search').oninput=e=>{asm.search=e.target.value.trim().toLowerCase();asmRender()};
   id('asm-csv').onclick=asmExport;
   id('asm-print').onclick=()=>window.print();
   id('asm-grid').onclick=e=>{const row=e.target.closest('[data-asm-level]');if(row){asm.selected=row.dataset.asmLevel;asm.showAllOrders=false;asm.detailOpen=null;asmRender();}};
   id('asm-ledger').onclick=e=>{const b=e.target.closest('[data-asm-order]');if(b){const orderId=Number(b.dataset.asmOrder);asm.detailOpen=asm.detailOpen===orderId?null:orderId;asmRenderDetailsOnly();}};
   id('asm-ledger-note').onclick=e=>{if(e.target.closest('#asm-all-orders')){asm.showAllOrders=true;asmRender();}};
   asmRender();
  }
  function asmExport(){
   const records=asmPurchaseRows(),levels=AGENCY_LEVELS.map(t=>asmTierInfo(t,records));
   const p=asmPerson();
   const rows=levels.map(v=>[p?.id||'',p?.name||'',p?.business_name||'',v.level.code,v.level.name,asmStateLabel(v.state),v.lastOrder?asmOrderStatus(v.lastOrder):'Not ordered',v.lastOrder?asmPaymentStatus(v.lastOrder):'—',v.level.investment,v.level.pouchRate,v.level.pouchQty,v.level.familyPack,v.level.oneTime,v.level.incentive,v.level.duration,v.ordersPlaced,v.placedValue/100,v.confirmedOrders,v.sales/100,v.lines.map(x=>'ON'+x.order.id).join(' | '),v.lines.some(x=>x.source==='amount')?'Review amount match':'Named item / explicit label',asm.from||'All',asm.to||'All',asm.finished?'Completed':'Still checking']);
   A.csv('Agency Sales Matrix',['Account ID','Name','Business','Chart Code','Agency','Order indicator','Latest order status','Latest payment status','Chart investment INR','Pouch rate INR','Pouch quantity','Family packs','One-time target INR','Incentive / target INR','Chart duration','Orders placed','Agency ordered value INR','Collected order count','Collected agency items INR','Linked order IDs','Match verification','From IST','Through IST','Scan status'],rows,'Green = order placed, regardless of payment; collected values use paid, non-cancelled orders only. Amount-only matching must be verified.');
  }
  function asmRender(){
   const root=document.getElementById('agency-sheet');if(!root||asm.uid===null)return;
   const id=x=>document.getElementById(x);
   const period=id('asm-period');if(!period)return;
   period.value=asm.period;id('asm-from').value=asm.from;id('asm-to').value=asm.to;
   id('asm-status').value=asm.status;id('asm-order-filter').value=asm.orderFilter;
   if(Number(id('asm-user').value)!==asm.uid)id('asm-user').value=String(asm.uid);
   asm.invalidRange=!!(asm.from&&asm.to&&asm.from>asm.to);
   const records=asmPurchaseRows();const levels=AGENCY_LEVELS.map(t=>asmTierInfo(t,records));
   const hasRangeError=!!(asm.from&&asm.to&&asm.from>asm.to);asm.invalidRange=hasRangeError;
   const purchased=levels.filter(v=>v.state==='purchased').length;
   const awaiting=levels.filter(v=>v.lines.some(x=>!asmIsCollected(x.order)&&asmValidOrder(x.order))).length;
   const pending=levels.filter(v=>v.state==='pending').length;
   const orderPaid=records.filter(o=>asmValidOrder(o)&&asmIsCollected(o));
   const orderSales=orderPaid.reduce((n,o)=>n+(Number(o.total_paise)||0),0);
   const agencySales=levels.reduce((n,v)=>n+v.sales,0);
   const unclassified=records.filter(o=>o.scanned&&!o.failed&&!o.agencyLines.length).length;
   const scanErrors=records.filter(o=>o.failed).length;
   id('asm-stats').innerHTML=[
    ['Levels ordered',`${purchased} / ${AGENCY_LEVELS.length}`,'good'],['Levels not ordered',asm.finished?String(pending):'Checking…','bad'],
    ['Awaiting collection',String(awaiting),'warn'],['All collected orders',asmRupees(orderSales),''],
    ['Agency collected value',asmRupees(agencySales),'good'],['Orders in period',asmNum(records.length),'']
   ].map(([label,value,cls])=>`<div class="asm-stat ${cls}"><span>${esc(label)}</span><strong title="${esc(value)}">${esc(value)}</strong></div>`).join('');
   const search=asm.search;
   const filteredLevels=levels.filter(v=>(asm.status==='all'||(asm.status==='awaiting'?v.lines.some(x=>!asmIsCollected(x.order)&&asmValidOrder(x.order)):v.state===asm.status))&&(!search||`${v.level.name} ${v.level.code} ${v.lines.map(x=>x.order.id).join(' ')} ${v.lastOrder?.status||''} ${v.lastOrder?.payment_status||''}`.toLowerCase().includes(search)));
   id('asm-level-count').textContent=filteredLevels.length+' of '+AGENCY_LEVELS.length+' levels';
   id('asm-level-rows').innerHTML=filteredLevels.map(v=>`<tr data-asm-level="${v.level.id}" class="${asm.selected===v.level.id?'asm-selected':''}" title="Select ${esc(v.level.name)}">
    <td><span class="asm-name">${esc(v.level.name)}</span><span class="asm-code">${esc(v.level.code)}</span></td><td>${asmPill(v.state)}${v.lines.some(x=>x.source==='amount')?'<small class="asm-match-warning">Amount match · verify</small>':''}</td><td>${v.lastOrder?`<span class="asm-order-status">${esc(asmOrderStatus(v.lastOrder))}</span><small class="asm-order-ref">#ON${asmNum(v.lastOrder.id)}</small>`:'—'}</td><td>${v.lastOrder?esc(asmPaymentStatus(v.lastOrder)):'—'}</td><td>${asmMoney(v.level.investment)}</td><td>${asmMoney(v.level.pouchRate)}</td><td>${asmNum(v.level.pouchQty)}</td><td>${asmNum(v.level.familyPack)}</td><td>${asmMoney(v.level.oneTime)}</td><td>${typeof v.level.incentive==='number'?asmMoney(v.level.incentive):esc(v.level.incentive)}</td><td>${esc(v.level.duration)}</td><td>${asmNum(v.ordersPlaced)}</td><td>${asmRupees(v.placedValue)}</td><td>${asmRupees(v.sales)}</td></tr>`).join('')||'<tr><td colspan="14">No agency levels match these filters.</td></tr>';
   const user=asmPerson();
   id('asm-user-card').innerHTML=`<div><h4>${esc(user?.business_name||user?.name||'Retailer')} <small>#${asmNum(user?.id)}</small></h4>
    <p>${esc(user?.name||'—')} · ${esc(user?.email||'—')} · ${esc(user?.phone||'—')}</p><p>Registered ${asmPresent(user?.created_at)} · ${asmNum(asmAllUserOrders().length)} orders (all dates)</p></div>
    <div class="asm-user-tags"><span>${esc(user?.role||'—')}</span><span>${esc(user?.status||'—')}</span><span>COD ${user?.cod_allowed?'Allowed':'Disabled'}</span></div>`;
   const selected=levels.find(v=>v.level.id===asm.selected)||levels[0];
   const selectedOrders=selected.lines.slice().sort((a,b)=>asmOrdId(b.order)-asmOrdId(a.order));
   const amountMatches=selectedOrders.filter(x=>x.source==='amount');
   id('asm-focus').innerHTML=`<div class="asm-focus-head"><h4>${esc(selected.level.code)} · ${esc(selected.level.name)}</h4>${asmPill(selected.state)}</div>
    <div class="asm-focus-body"><div class="asm-focus-metrics"><div><span>Chart investment</span><strong>${asmMoney(selected.level.investment)}</strong></div>
      <div><span>Ordered amount</span><strong>${asmRupees(selected.placedValue)}</strong></div><div><span>Collected agency value</span><strong>${asmRupees(selected.sales)}</strong></div></div>
     ${selectedOrders.length?`<div style="font-size:11px"><b>Matching orders (${selected.ordersPlaced}):</b> ${selectedOrders.map(x=>`<div class="asm-linked-order"><b>#ON${asmNum(x.order.id)}</b> · Order: <b>${esc(asmOrderStatus(x.order))}</b> · Payment: <b>${esc(asmPaymentStatus(x.order))}</b>${x.source==='amount'?' · <em>Amount match (verify)</em>':''}</div>`).join('')}</div>`:
      `<div class="asm-empty">${asm.finished?'No order matched this level within the selected dates.':'Checking order details. Orders with a named agency or exact chart investment will be linked automatically.'}</div>`}
     ${amountMatches.length?`<div class="asm-empty" style="margin-top:8px;border-color:#d0ad6c"><b>Verification needed:</b> ${amountMatches.length} order(s) match the exact chart investment amount, but their items do not explicitly name this agency. They are shown as ordered in green; confirm these are the intended agency packages.</div>`:''}
     <p class="asm-footnote">Green means a matching order exists; it does not mean the payment was received or an incentive was earned. Payment and fulfilment remain visible independently.</p></div>`;
   const visible=records.filter(o=>{
    if(!asm.showAllOrders&&!o.agencyLines.some(x=>x.id===asm.selected))return false;
    if(asm.orderFilter==='paid'&&!(asmValidOrder(o)&&asmIsCollected(o)))return false;
    if(asm.orderFilter==='unpaid'&&(!asmValidOrder(o)||asmIsCollected(o)))return false;
    if(asm.orderFilter==='cancelled'&&asmValidOrder(o))return false;
    if(asm.orderFilter==='agency'&&!o.agencyLines.length)return false;
    if(asm.orderFilter==='unknown'&&(o.agencyLines.length||!o.scanned||o.failed))return false;
    if(search&&!`${o.id} on${o.id} ${o.status||''} ${o.payment_status||''} ${(o.product_titles||[]).join(' ')} ${o.agencyLines.map(x=>x.title).join(' ')}`.toLowerCase().includes(search))return false;
    return true;
   });
   id('asm-order-count').textContent=visible.length+' orders displayed';
   id('asm-ledger-note').innerHTML=`<span>${asm.showAllOrders?'All orders in selected dates':'Orders with '+esc(selected.level.name)} · ${visible.length} shown · ${unclassified} checked without agency match${scanErrors?', '+scanErrors+' read errors':''}</span>${!asm.showAllOrders?'<button id="asm-all-orders">Show all orders</button>':''}`;
   id('asm-ledger').innerHTML=visible.map(o=>{
    const label=o.failed?'Could not inspect':!o.scanned?'Checking…':o.agencyLines.length?o.agencyLines.map(x=>AGENCY_LEVELS.find(v=>v.id===x.id)?.name||x.id).join(', '):'Unclassified product';
    const st='purchased';
    return `<tr><td><b>#ON${asmNum(o.id)}</b><small>${esc(o.payment_method||'—')}</small></td><td>${asmPresent(o.created_at)}</td><td>${esc(o.status||'—')}</td>
      <td>${esc(o.payment_status||'—')}</td><td><b>${asmRupees(o.total_paise)}</b></td><td>${asmPill(st)}<small>${esc(label)}${o.agencyLines.some(x=>x.source==='amount')?' · Amount match (verify)':''}</small></td>
      <td><button data-asm-order="${Number(o.id)}">${asm.detailOpen===Number(o.id)?'Hide':'Inspect'}</button></td></tr>`;
   }).join('')||'<tr><td colspan="7" class="asm-empty">No orders match the current selections.</td></tr>';
   id('asm-progress').textContent=(hasRangeError?'Invalid date range. ':'')+(asm.running?`Checking details: ${asm.seen}/${asm.total} orders…`:`Detail scan ${asm.seen}/${asm.total} complete.`)+(scanErrors?` ${scanErrors} could not be inspected; missing agency levels may be uncertain.`:'');
   if(scanErrors)id('asm-progress').className='error';else id('asm-progress').className='';
   asmRenderDetailsOnly();
  }
  function asmRenderDetailsOnly(){
   const target=document.getElementById('asm-detail');if(!target)return;
   const o=asmAllUserOrders().find(x=>asmOrdId(x)===asm.detailOpen);
   if(!o){target.hidden=true;target.innerHTML='';return;}
   const detail=asm.detailCache.get(asmOrdId(o));
   target.hidden=false;target.className='asm-detail';
   if(!detail){target.innerHTML=`<h4>Order #ON${asmNum(o.id)}</h4><div class="asm-detail-inner">${esc(asm.failures.get(asmOrdId(o))||'Order details are being loaded…')}</div>`;return;}
   const items=detail.items||[];
   target.innerHTML=`<h4>Order #ON${asmNum(o.id)} · Item verification</h4><div class="asm-detail-inner">
    <div class="asm-data"><div><label>Created</label>${asmPresent(o.created_at)}</div><div><label>Order total</label>${asmRupees(o.total_paise)}</div>
    <div><label>Payment</label>${esc(o.payment_status||'—')} · ${esc(o.payment_method||'—')}</div><div><label>Fulfilment</label>${esc(o.status||'—')}</div></div>
    <table><thead><tr><th>Item at order time</th><th>Qty</th><th>Item amount</th><th>Agency classification</th></tr></thead><tbody>${items.map(i=>{
     const tier=AGENCY_LEVELS.find(t=>t.id===asmIdentify(i));const qty=Number(i.qty||i.quantity||1);const unit=Number(i.unit_price_paise);
     return `<tr><td>${esc(i.title||i.product_title||'Untitled')}</td><td>${asmNum(qty)}</td><td>${Number.isFinite(unit)?asmRupees(qty*unit):'—'}</td><td>${tier?esc(tier.name):'No verified agency mapping'}</td></tr>`;
    }).join('')}</tbody></table><p class="asm-footnote">Green represents a placed order, not settled payment. Named agency lines are verified from order details; exact-value matches are provisional and should be checked against the actual agency package. Cancelled/refunded orders remain listed with their real order status; they are excluded from collected sales.</p></div>`;
  }

 A.wireDates(()=>{page=1;render();window.__closeUsersSheets?.()});
 for(const id of ['search','type','status'])$(id).oninput=()=>{page=1;render()};
 $('prev').onclick=()=>{page--;render()};
 $('next').onclick=()=>{page++;render()};
 $('refresh').onclick=async()=>{try{await load();window.__closeUsersSheets?.()}catch(e){A.error(e)}};
 $('export').onclick=()=>{
  try{
   A.csv('Users',['ID','Name','Business','Email','Phone','Role','Status','COD allowed','Created IST'],filtered().map(u=>[u.id,u.name,u.business_name,u.email,u.phone,u.role,u.status,u.cod_allowed,A.date(u.created_at)]),'Accounts created '+A.range().label);
  }catch(e){A.error(e)}
 };
 await load();
})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script>
</body>
</html>
