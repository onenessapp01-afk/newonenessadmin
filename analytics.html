.admin-bottom-card{display:grid!important;gap:8px}.admin-profile{display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;align-items:center;padding:9px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05)}

.analytics-workspace.fullscreen-sheet .analytics-workspace-bar{display:flex;flex:0 0 auto}.analytics-workspace.fullscreen-sheet .analytics-filters{margin:0;border-radius:0;padding:6px 0 7px;background:#f4f6f2;border-left:0;border-right:0}.analytics-workspace.fullscreen-sheet .analytics-kpis{margin-top:6px}.analytics-workspace.fullscreen-sheet .analytics-lower{flex:1 1 auto;min-height:0}.analytics-workspace.fullscreen-sheet .report-shell{border-radius:0}.analytics-workspace.fullscreen-sheet.dense .report-table th{padding:5px;font-size:7px}.analytics-workspace.fullscreen-sheet.dense .report-table td{padding:5px;font-size:8px}

/* ==========================================================
   ONENESS ANALYTICS APP · LARGE / READABLE
   ========================================================== */
:root{
 --an-wine:#68141d;--an-wine-dark:#430a11;--an-wine-mid:#812531;
 --an-gold:#c8942d;--an-gold-soft:#f4dfaa;--an-paper:#fbf7ee;
 --an-surface:#fffdf8;--an-cream:#fffaf0;--an-line:#e6dac4;
 --an-ink:#2b211c;--an-muted:#776b61;--an-danger:#9f3c31;--an-success:#356b4b
}

/* Boot */
.analytics-boot{
 position:fixed;inset:0;z-index:100000;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 42%,rgba(229,187,84,.13),transparent 31%),var(--an-paper)
}
.analytics-boot-wrap{display:grid;justify-items:center;gap:10px}
.analytics-boot-logo{width:76px;height:48px;object-fit:contain}
.analytics-boot-inf{width:96px;height:56px;overflow:visible;filter:drop-shadow(0 6px 12px rgba(104,20,29,.12))}
.analytics-boot-inf path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.analytics-boot-inf .base{stroke:#ead9aa;stroke-width:6}
.analytics-boot-inf .flow{stroke:url(#analyticsBootGold);stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:analyticsInf 1.55s cubic-bezier(.65,0,.35,1) infinite}
.analytics-boot-inf .shine{stroke:#fff6ce;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:analyticsInf 1.55s cubic-bezier(.65,0,.35,1) infinite;opacity:.82}
@keyframes analyticsInf{0%{stroke-dashoffset:1;opacity:.35}44%{stroke-dashoffset:0;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-1;opacity:.3}}
.analytics-boot-word{color:var(--an-wine);font:700 18px/1 Georgia,"Times New Roman",serif;letter-spacing:.14em}
.analytics-boot-sub{color:#987837;font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}

/* Desktop workspace */
body.analytics-console{overflow:hidden!important;background:var(--an-paper)!important}
body.analytics-console .top{display:none!important}
body.analytics-console .main{height:100vh!important;overflow:hidden!important}
body.analytics-console .content{height:100vh!important;max-width:none!important;margin:0!important;padding:12px 16px 10px!important;overflow:hidden!important}
body.analytics-console #view{height:100%!important;display:flex!important;flex-direction:column!important;min-height:0!important;overflow:hidden!important}

/* Sidebar */
.side .brand:before,.side .brand:after{content:none!important;display:none!important}
.analytics-side-logo{display:block;width:40px;height:32px;object-fit:contain;flex:0 0 40px;filter:none}
.analytics-side-copy{display:grid;min-width:0}
.analytics-side-copy strong{color:#ffe7a3;font:700 15px/1.05 Georgia,"Times New Roman",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.analytics-side-copy span{margin-top:3px;color:#d8b75f;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
.admin-bottom-card{display:grid!important;gap:7px!important}
.admin-profile{
 display:grid!important;grid-template-columns:34px minmax(0,1fr)!important;gap:9px!important;align-items:center!important;
 padding:8px!important;border:1px solid rgba(237,203,120,.18)!important;border-radius:9px!important;background:rgba(255,249,229,.055)!important;overflow:hidden!important
}
.avatar-btn{
 display:grid!important;place-items:center!important;width:34px!important;min-width:34px!important;max-width:34px!important;height:34px!important;
 min-height:34px!important;max-height:34px!important;padding:0!important;margin:0!important;border:1px solid rgba(244,211,128,.42)!important;
 border-radius:50%!important;overflow:hidden!important;background:#7b2330!important;color:#ffe9a9!important;font:700 14px/1 Georgia!important
}
.avatar-btn img{display:block!important;width:34px!important;height:34px!important;object-fit:cover!important;object-position:center!important;border-radius:50%!important}
.admin-profile-copy{min-width:0!important;overflow:hidden!important}
.admin-profile-copy b{display:block!important;color:#fff6e5!important;font-size:12px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.admin-profile-copy span{display:block!important;margin-top:2px!important;color:#d7c5a8!important;font-size:10px!important;text-transform:uppercase!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.admin-panel-label{display:none!important}
.side .bottom #logout{width:100%!important;min-height:34px!important;padding:5px 8px!important;background:rgba(255,255,255,.045)!important;border-color:rgba(237,204,123,.18)!important;color:#f4ddb0!important;font-size:11px!important}

/* Header */
.analytics-head{
 flex:0 0 auto!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;
 gap:14px!important;margin:0 0 8px!important;padding:13px 15px!important;border:1px solid var(--an-line)!important;
 border-radius:11px!important;background:var(--an-surface)!important
}
.analytics-head h1{margin:0!important;color:var(--an-wine-dark)!important;font:700 32px/1.05 Georgia,"Times New Roman",serif!important;letter-spacing:-.4px!important}
.analytics-head p{margin:6px 0 0!important;color:var(--an-muted)!important;font-size:14px!important;line-height:1.45!important}
.head-actions{display:flex!important;justify-content:flex-end!important;align-items:center!important;gap:6px!important;flex-wrap:wrap!important}
.head-actions button{min-height:38px!important;padding:6px 10px!important;border-radius:7px!important;font-size:12px!important}
.head-actions .primary{background:var(--an-wine)!important;border-color:var(--an-wine)!important;color:#fff0ce!important}
.export-excel{background:#fff3d8!important;color:#674d18!important;border-color:#dec37b!important}
.export-pdf{background:#fff0ec!important;color:#913b30!important;border-color:#e6c2ba!important}

/* Workspace + filters */
.analytics-workspace{display:flex!important;flex-direction:column!important;flex:1 1 auto!important;min-height:0!important}
.analytics-filters{flex:0 0 auto!important;margin-bottom:6px!important;padding:9px!important;border:1px solid var(--an-line)!important;border-radius:9px!important;background:var(--an-surface)!important}
.filter-grid{display:grid!important;grid-template-columns:minmax(170px,1fr) 135px 135px 145px minmax(240px,1.35fr) auto!important;gap:8px!important;align-items:end!important}
.filter-grid label{margin:0!important;color:#5e5148!important;font-size:11px!important;font-weight:750!important;min-width:0!important}
.filter-grid input,.filter-grid select{width:100%!important;min-height:40px!important;padding:8px 9px!important;border-radius:7px!important;font-size:13px!important}
.filter-actions{display:flex!important;align-items:end!important;gap:6px!important}
.filter-actions button{min-height:40px!important;padding:6px 10px!important;font-size:11px!important}
.filter-actions .primary{background:var(--an-wine)!important;border-color:var(--an-wine)!important;color:#fff0ce!important}
.report-hint{flex:0 0 auto!important;margin:0 2px 6px!important;color:var(--an-muted)!important;font-size:11px!important;line-height:1.35!important}
.report-hint .stale{color:#8b601a!important;font-weight:850!important}

/* KPIs */
.analytics-kpis{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:7px!important;flex:0 0 auto!important;margin-bottom:7px!important}
.kpi{min-width:0!important;min-height:75px!important;padding:11px 12px!important;border:1px solid var(--an-line)!important;border-radius:9px!important;background:var(--an-surface)!important}
.kpi span{display:block!important;color:#7b6d63!important;font-size:10px!important;font-weight:850!important;text-transform:uppercase!important;letter-spacing:.45px!important}
.kpi strong{display:block!important;margin-top:5px!important;color:var(--an-wine-dark)!important;font:700 21px/1 Georgia,"Times New Roman",serif!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.kpi small{display:block!important;margin-top:4px!important;color:#85776d!important;font-size:10px!important}
.kpi.good{background:#eef3e7!important;border-color:#d7dfc8!important}
.kpi.warn{background:#fff5df!important;border-color:#ead6aa!important}
.kpi.blue{background:#f5e9eb!important;border-color:#e8ced2!important}

/* Main report area */
.analytics-lower{display:grid!important;grid-template-columns:minmax(0,1fr) 280px!important;gap:8px!important;flex:1 1 auto!important;min-height:0!important}
.report-shell{min-height:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;border:1px solid var(--an-line)!important;border-radius:9px!important;background:var(--an-surface)!important}
.report-bar{flex:0 0 auto!important;padding:8px 10px!important;background:var(--an-wine)!important;color:#fff1d2!important}
.report-bar b{font-size:13px!important}
.report-bar span{color:#dec99c!important;font-size:10px!important}
.report-table-wrap{flex:1 1 auto!important;min-height:0!important;overflow:auto!important}
.report-table{width:100%!important;border-collapse:separate!important;border-spacing:0!important;table-layout:auto!important}
.report-table th{
 position:sticky!important;top:0!important;z-index:5!important;padding:9px 8px!important;border-bottom:1px solid #dccfb7!important;
 background:#f5ecd9!important;color:#695747!important;font-size:10px!important;font-weight:850!important;text-transform:uppercase!important;
 letter-spacing:.35px!important;white-space:nowrap!important
}
.report-table th:hover{background:#efe1c6!important}
.report-table th.sort-active{color:var(--an-wine)!important}
.sort-mark{font-size:9px!important;margin-left:3px!important}
.report-table td{
 padding:9px 8px!important;border-bottom:1px solid #eee4d2!important;background:#fffdf8!important;color:#3f342d!important;
 font-size:11px!important;vertical-align:middle!important;white-space:normal!important;overflow-wrap:anywhere!important
}
.report-table tbody tr:nth-child(even) td{background:#fffbf4!important}
.report-table tr:hover td{background:#fff6e4!important}
.report-table td.numeric{font-weight:750!important}
.order-link{color:var(--an-wine)!important;font-size:11px!important;font-weight:900!important}
.table-empty{min-height:230px!important;color:#84766b!important;font-size:12px!important}
.report-footer{flex:0 0 auto!important;padding:7px 8px!important;border-top:1px solid #eee3d0!important;color:var(--an-muted)!important;font-size:11px!important}
.pager{gap:6px!important}
.pager button,.pager select{min-height:34px!important;padding:5px 8px!important;font-size:11px!important}

/* Insight panel */
.insights{gap:8px!important;min-height:0!important;overflow:auto!important;scrollbar-width:none}
.insights::-webkit-scrollbar{display:none}
.insight-card,.chart-card{padding:12px!important;border:1px solid var(--an-line)!important;border-radius:9px!important;background:#fffdf8!important}
.insight-card h3,.chart-card h3{margin:0 0 8px!important;color:var(--an-wine)!important;font-size:13px!important}
.insight-card p{color:#74675e!important;font-size:11px!important;line-height:1.5!important}
.insight-main{margin-bottom:4px!important;color:var(--an-wine-dark)!important;font-size:19px!important;font-weight:900!important;line-height:1.15!important}
.insight-list{gap:7px!important}
.insight-row{grid-template-columns:minmax(0,1fr) auto!important;gap:7px!important;padding-bottom:7px!important;border-bottom:1px solid #eee4d2!important;font-size:11px!important}
.insight-row b{color:#4c3c32!important}
.mini-bars{gap:8px!important}
.mini-bar{grid-template-columns:90px 1fr 55px!important;gap:7px!important;font-size:10px!important}
.mini-bar i{height:9px!important;background:#eee3cf!important}
.mini-bar i:before{background:linear-gradient(90deg,#9d6a18,#d5a63b)!important}
.mini-bar b{font-size:10px!important}

/* Sheet mode */
.analytics-workspace-bar{background:var(--an-wine)!important;color:#fff1d2!important}
.workspace-title strong{font-size:13px!important}
.workspace-title span{color:#dec99c!important;font-size:10px!important}
.workspace-actions button{min-height:31px!important;padding:4px 8px!important;font-size:9px!important;background:#fff7e4!important;color:var(--an-wine)!important;border-color:#fff7e4!important}
.workspace-actions .exit-sheet{background:#f2d889!important;border-color:#f2d889!important}

function buildAnalyticsMobileChrome(){
 const links=[...document.querySelectorAll('.side nav a')].map(a=>({href:a.getAttribute('href'),label:a.textContent.trim(),active:a.classList.contains('active')}));
 const key=x=>String(x.href||'').replace('.html','');
 const preferred=['dashboard','orders','payments','analytics'],primary=[];

async function avatarBase64(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPG, PNG or WebP for the profile photo.');
 const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
 const size=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-size)/2,sy=(img.naturalHeight-size)/2;
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;canvas.getContext('2d').drawImage(img,sx,sy,size,size,0,0,512,512);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.86));if(!blob)throw Error('Could not prepare profile photo.');
 return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});
}

 });

async function generate(){
 window.__closeAnalyticsSheets?.();
 if(building)return;
 building=true;cancel=false;baseRows=[];rows=[];headers=[];metrics=[];insights=[];chartItems=[];sortIndex=-1;sortDir=1;page=1;
 $('warnings').innerHTML='';$('generate').disabled=true;$('cancel').hidden=false;setExports(false);$('stale-state').textContent='';
 try{
  reportType=$('report').value;
  const r=A.range();
  orders=await A.all('orders.list',{},n=>$('progress').textContent=`Loaded ${n} order headers…`);
  if(cancel)throw Error('Report cancelled. No partial export was produced.');

  if(A.can('coupons'))coupons=await A.all('admin.coupons');
  const created=orders.filter(o=>A.inRange(o.created_at,r)),sales=delivered(r);
  let total=null,basis='',metricExtras=[];
  const allDates=r.start===-Infinity&&r.end===Infinity;
  if(['sales','products','retailers'].includes(reportType)){
   const missing=orders.filter(o=>o.status==='delivered'&&!o.delivered_at).length;
   if(missing&&!allDates)$('warnings').innerHTML=`<div class="notice">${missing} delivered order${missing===1?'':'s'} have no recorded delivery timestamp and are excluded from this dated sales report.</div>`;
  }

  if(reportType==='orders'){
   headers=['Order ID','Retailer','Created IST','Status','Total INR','Discount INR','Payment','Method'];
   baseRows=created.map(o=>[o.id,retailerName(o.user_id),A.date(o.created_at),o.status,amount(o.total_paise),amount(o.discount_paise),o.payment_status,(o.payment_method||'').toUpperCase()]);
   basis='Order creation date · all statuses';
   const valid=created.filter(o=>!['syncing','cancelled'].includes(o.status));
   total=valid.reduce((n,o)=>n+Number(o.total_paise||0),0);
   const avg=valid.length?total/valid.length:0;
   metricExtras=[['Average order',money(avg),'Valid orders','blue']];
   const counts=new Map();for(const o of created)counts.set(o.status,(counts.get(o.status)||0)+1);
   chartItems=[...counts].sort((a,b)=>b[1]-a[1]);
   const top=chartItems[0];
   insights=[[top?`${top[0]} is the largest status`:'No orders',top?`${top[1]} of ${created.length} orders are currently ${top[0]}.`:'No orders match this period.']];
  }

  if(reportType==='sales'){
   headers=['Order ID','Retailer','Delivered IST','Net order INR','Coupon discount INR','Payment','Method'];
   baseRows=sales.map(o=>[o.id,retailerName(o.user_id),A.date(o.delivered_at),amount(o.total_paise),amount(o.discount_paise),o.payment_status,(o.payment_method||'').toUpperCase()]);
   basis='Delivery date · net order total includes delivery charges';
   total=sales.reduce((n,o)=>n+Number(o.total_paise||0),0);
   metricExtras=[['Average sale',money(sales.length?total/sales.length:0),'Per delivered order','blue']];
   const byShop=new Map();for(const o of sales)byShop.set(retailerName(o.user_id),(byShop.get(retailerName(o.user_id))||0)+Number(o.total_paise||0));
   const ranked=[...byShop].sort((a,b)=>b[1]-a[1]);chartItems=ranked.slice(0,8).map(x=>[x[0],x[1],money(x[1])]);
   insights=[[ranked[0]?.[0]||'No delivered sales',ranked[0]?`${money(ranked[0][1])} delivered value in this period.`:'No delivered orders match this period.']];
  }

  if(reportType==='collections'){
   const data=orders.filter(o=>o.payment_status==='collected'&&A.inRange(o.payment_recorded_at||o.collected_at,r));
   headers=['Order ID','Retailer','Paid / Recorded IST','Collected INR','Order Payment','Received Via','Reference','Recorded By'];
   baseRows=data.map(o=>[o.id,retailerName(o.user_id),A.date(o.payment_recorded_at||o.collected_at),amount(o.total_paise),(o.payment_method||'').toUpperCase(),receivedLabel(o),o.payment_reference||'—',o.payment_recorded_by_name||((o.payment_method==='online')?'Payment Gateway':'—')]);
   basis='Payment recorded date, falling back to collected date for legacy records';
   total=data.reduce((n,o)=>n+Number(o.total_paise||0),0);
   const methods=new Map();for(const o of data){const k=receivedLabel(o);methods.set(k,(methods.get(k)||0)+Number(o.total_paise||0))}
   const ranked=[...methods].sort((a,b)=>b[1]-a[1]);chartItems=ranked.map(x=>[x[0],x[1],money(x[1])]);
   insights=[[ranked[0]?.[0]||'No collections',ranked[0]?`${money(ranked[0][1])} collected through ${ranked[0][0]}.`:'No collected payments match this period.']];
  }

  if(reportType==='outstanding'){
   const data=orders.filter(o=>o.status==='delivered'&&o.payment_status==='unpaid');
   headers=['Order ID','Retailer','Delivered IST','Outstanding INR','Days since delivery','Payment Method'];
   baseRows=data.map(o=>[o.id,retailerName(o.user_id),A.date(o.delivered_at),amount(o.total_paise),o.delivered_at?Math.max(0,Math.floor((Date.now()-Date.parse(o.delivered_at))/86400000)):'Unknown',(o.payment_method||'').toUpperCase()]);
   basis='Current delivered-unpaid snapshot · date range not applied';
   total=data.reduce((n,o)=>n+Number(o.total_paise||0),0);

   insights=[[oldest?retailerName(oldest.user_id):'No outstanding',oldest?`Oldest unpaid delivered order is #ON${oldest.id}.`:'All delivered orders are settled.']];
  }

  if(reportType==='products'){
   const grouped=new Map();
   for(let i=0;i<sales.length;i++){
    if(cancel)throw Error('Report cancelled. No partial export was produced.');

  }

   metricExtras=[['Low / out stock',String(low.length),'Using product alert quantities','warn']];
   chartItems=low.slice(0,8).map(p=>[p.title,Math.max(0,Number(p.low_stock_alert_qty??10)-Number(p.stock||0)+1),`${p.stock}/${p.low_stock_alert_qty??10}`]);
   insights=[[low.length?`${low.length} product${low.length===1?'':'s'} need attention`:'Stock looks healthy',low.length?'Low-stock state is based on each product’s own alert quantity.':'No product is at or below its low-stock alert quantity.']];
  }

  if(cancel)throw Error('Report cancelled. No partial export was produced.');
  reportTitle=$('report').selectedOptions[0].text;
  meta=(['outstanding','inventory'].includes(reportType)?'As of '+A.date(new Date()):r.label)+'; '+basis;

  const q=currentSearch();
  rows=!q?[...baseRows]:baseRows.filter(row=>row.map(v=>String(v??'')).join(' ').toLowerCase().includes(q));

  metrics=[['Report rows',String(rows.length),basis,'']];
  if(total!==null)metrics.push([reportType==='orders'?'Confirmed order value':reportType==='coupons'?'Discount value':'Report value',money(total),reportType==='orders'?'Excludes syncing and cancelled':'Generated report total','good']);
  metrics.push(...metricExtras);

  if(Number.isFinite(r.start)&&Number.isFinite(r.end)&&['orders','sales','collections'].includes(reportType)){
   const previous=previousRange(r);
   let nowValue,beforeValue,label;
   if(reportType==='orders'){nowValue=created.length;beforeValue=orders.filter(o=>A.inRange(o.created_at,previous)).length;label='Order count'}
   else if(reportType==='sales'){nowValue=total||0;beforeValue=delivered(previous).reduce((n,o)=>n+Number(o.total_paise||0),0);label='Sales value'}
   else {nowValue=total||0;beforeValue=orders.filter(o=>o.payment_status==='collected'&&A.inRange(o.payment_recorded_at||o.collected_at,previous)).reduce((n,o)=>n+Number(o.total_paise||0),0);label='Collected value'}
   metrics.push(['Vs previous period',percentChange(nowValue,beforeValue),`${label} · same-length prior period`,Number(nowValue)>=Number(beforeValue)?'good':'warn']);
  }

  generated=true;lastGeneratedAt=new Date();$('stale-state').textContent='';$('progress').textContent=`${baseRows.length} generated rows · search, sorting and paging are live. ${basis}.`;setExports(true);renderCurrent();
 }catch(e){
  generated=false;baseRows=[];rows=[];headers=[];metrics=[];insights=[];chartItems=[];$('progress').textContent=A.error(e);setExports(false);renderCurrent();
 }finally{
  building=false;$('generate').disabled=false;$('cancel').hidden=true;
 }
}
function updateReportMode(){
 const snapshot=['inventory','outstanding'].includes($('report').value);
 for(const id of ['from','to','period'])$(id).disabled=snapshot;
 markStale();
}
function updateSheetMeta(){
 const el=$('sheet-meta');if(!el)return;
 const stamp=lastGeneratedAt?lastGeneratedAt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—';
 el.textContent=generated?`${reportTitle} · ${rows.length} matching · ${baseRows.length} generated · ${stamp}`:'Generate a report to begin';
}
function syncSheetButtons(){
 $('sheet-view').textContent=sheetMode?'⛶ Exit Sheet View':'⛶ Sheet View';
 $('sheet-density').textContent=denseMode?'Comfortable rows':'Compact rows';
}
async function enterSheetMode(){
 window.__closeAnalyticsSheets?.();
 const ws=$('analyticsWorkspace');sheetMode=true;ws.classList.add('fullscreen-sheet');document.body.classList.add('pay-sheet-lock');syncSheetButtons();updateSheetMeta();
 try{if(ws.requestFullscreen&&!document.fullscreenElement)await ws.requestFullscreen()}catch{}
}
async function exitSheetMode(){
 const ws=$('analyticsWorkspace');sheetMode=false;ws.classList.remove('fullscreen-sheet');document.body.classList.remove('pay-sheet-lock');syncSheetButtons();
 try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}
}
function toggleSheetMode(){return sheetMode?exitSheetMode():enterSheetMode()}
function toggleDensity(){denseMode=!denseMode;$('analyticsWorkspace').classList.toggle('dense',denseMode);syncSheetButtons()}

const loadExternalScript=src=>new Promise((resolve,reject)=>{
 const existing=[...document.scripts].find(s=>s.src===src);
 if(existing){if(existing.dataset.loaded==='1')return resolve();existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return}
 const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>{s.dataset.loaded='1';resolve()};s.onerror=()=>reject(Error('Could not load export library. Check your connection.'));document.head.append(s);
});
function exportObjects(){return rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??''])))}
async function exportExcel(){
 if(!generated)throw Error('Generate a report first.');
 await loadExternalScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
 if(!window.XLSX)throw Error('Excel export library did not load.');
 const ws=XLSX.utils.json_to_sheet(exportObjects());ws['!cols']=headers.map(h=>({wch:Math.min(32,Math.max(12,h.length+3))}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Analytics');XLSX.writeFile(wb,`oneness-${reportType||'analytics'}-${A.today()}.xlsx`);
}
async function exportPdf(){
 if(!generated)throw Error('Generate a report first.');
 await loadExternalScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 const jspdf=window.jspdf;if(!jspdf?.jsPDF)throw Error('PDF export library did not load.');
 const doc=new jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight(),margin=22;
 const count=Math.max(1,headers.length),usable=pageW-margin*2,colW=usable/count,rowH=22,headerH=24;
 function pageHeader(){
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(23,99,76);doc.text(`ONeness · ${reportTitle}`,margin,23);
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(90,105,97);doc.text(meta,margin,36,{maxWidth:usable});
  let x=margin,y=47;doc.setFillColor(23,99,76);doc.rect(margin,y,usable,headerH,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(6);
  headers.forEach(h=>{doc.text(doc.splitTextToSize(String(h),Math.max(18,colW-6)).slice(0,2),x+3,y+7);x+=colW});return y+headerH;
 }
 let y=pageHeader(),ri=0;
 for(const row of rows){
  if(y+rowH>pageH-24){doc.addPage();y=pageHeader()}
  if(ri%2){doc.setFillColor(248,250,248);doc.rect(margin,y,usable,rowH,'F')}
  let x=margin;doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(31,46,39);
  row.forEach(v=>{const lines=doc.splitTextToSize(String(v??''),Math.max(16,colW-6));doc.text(lines.slice(0,2),x+3,y+7);x+=colW});
  doc.setDrawColor(226,231,227);doc.line(margin,y+rowH,pageW-margin,y+rowH);y+=rowH;ri++;
 }
 doc.setFontSize(7);doc.setTextColor(100,110,104);doc.text(`Rows: ${rows.length}`,margin,pageH-10);
 doc.save(`oneness-${reportType||'analytics'}-${A.today()}.pdf`);
}
function exportCsv(){
 if(!generated)throw Error('Generate a report first.');
 A.csv(reportTitle,headers,rows,meta);
}
function printReport(){
 if(!generated)throw Error('Generate a report first.');
 A.print(reportTitle,`<p>${esc(meta)}</p>`+A.table(headers,rows.map(row=>row.map(esc))));
}

$('generate').onclick=generate;
$('cancel').onclick=()=>{cancel=true};
$('search').oninput=()=>{if(generated)applySearch()};
$('report').onchange=updateReportMode;
A.wireDates(markStale);
$('prev').onclick=()=>{page--;renderCurrent()};$('next').onclick=()=>{page++;renderCurrent()};$('page-size').onchange=()=>{pageSize=+$('page-size').value;page=1;renderCurrent()};
$('export').onclick=()=>{try{exportCsv()}catch(e){A.error(e)}};$('print').onclick=()=>{try{printReport()}catch(e){A.error(e)}};
$('excel').onclick=async()=>{try{await exportExcel()}catch(e){A.error(e)}};$('pdf').onclick=async()=>{try{await exportPdf()}catch(e){A.error(e)}};
$('sheet-view').onclick=()=>toggleSheetMode();$('exit-sheet').onclick=()=>exitSheetMode();$('sheet-density').onclick=toggleDensity;$('sheet-generate').onclick=generate;
$('sheet-export').onclick=()=>{try{exportCsv()}catch(e){A.error(e)}};$('sheet-print').onclick=()=>{try{printReport()}catch(e){A.error(e)}};
$('sheet-excel').onclick=async()=>{try{await exportExcel()}catch(e){A.error(e)}};$('sheet-pdf').onclick=async()=>{try{await exportPdf()}catch(e){A.error(e)}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&sheetMode){sheetMode=false;$('analyticsWorkspace').classList.remove('fullscreen-sheet');document.body.classList.remove('pay-sheet-lock');syncSheetButtons()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetMode)exitSheetMode()});
updateReportMode();renderCurrent();

})().catch(e=>{if(window.App)App.fail(e);else document.body.textContent='Could not load ONeness analytics. '+(e.message||e)});
</script>
</body>
