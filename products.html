.product-language-status.good{
 color:#356b4b;
 background:#eef4ea
}
.product-language-status.warn{
 color:#996020;
 background:#fff5de
}
.language-tabs{
 display:flex;
 gap:4px;
 padding:7px 8px 0;
 background:#fffaf0
}
.language-tab{
 min-height:30px!important;
 padding:4px 9px!important;
 border:1px solid #dfd2b9!important;
 border-bottom:0!important;
 border-radius:7px 7px 0 0!important;
 background:#f8efdf!important;
 color:#6d5d51!important;
 font-size:7px!important;
 font-weight:800!important
}
.language-tab.active{
 background:#fff!important;
 color:var(--px-wine)!important;
 border-color:#cda95d!important
}
.language-panel{
 display:none;
 padding:10px;
 background:#fff
}
.language-panel.active{display:block}
.language-panel-grid{
 display:grid;
 grid-template-columns:1fr;
 gap:7px
}
.language-panel label{
 display:grid;
 gap:4px;
 color:#5f5047;
 font-size:7px!important
}
.language-panel input,
.language-panel textarea{
 width:100%;
 min-height:35px!important;
 padding:6px 7px!important;
 border:1px solid #ddd0b6!important;
 border-radius:7px!important;
 background:#fff!important;
 font-size:9px!important
}
.language-panel textarea{min-height:70px!important}
.language-note{
 display:flex;
 align-items:flex-start;
 gap:6px;
 padding:7px 8px;
 border-radius:7px;
 background:#f8efdd;
 color:#715d43;
 font-size:6px;
 line-height:1.4
}
.language-auto-row{
 display:flex;
 align-items:center;
 gap:6px;
 margin-top:7px;
 color:#6c5c50;
 font-size:6px
}
.language-auto-row input{
 width:14px!important;
 height:14px!important;
 min-height:14px!important;
 margin:0!important
}
.lang-completeness{
 display:inline-flex;
 gap:3px;
 margin-top:4px;
 flex-wrap:wrap
}
.lang-dot{
 display:inline-flex;
 align-items:center;
 min-height:17px;
 padding:2px 5px;
 border-radius:999px;
 background:#f1eadc;
 color:#806f5f;
 font-size:5px;
 font-weight:850
}
.lang-dot.done{background:#eaf2e6;color:#356b4b}
@media(max-width:760px){
 .product-language-head{display:block}
 .product-language-actions{margin-top:7px}
 .product-language-actions button{width:100%}
 .language-tabs{overflow-x:auto}
 .language-tab{flex:0 0 auto}
}



/* ==========================================================
   PRODUCT EDITOR SAVE ACTIONS · ALWAYS VISIBLE
   ========================================================== */
#productEditor{
  display:none;
}
#productEditor[open]{
  display:block;
}
#productEditor form{
  height:min(88vh,820px)!important;
  max-height:min(88vh,820px)!important;
  overflow:hidden!important;
}
#productEditor .modal-body-pad{
  flex:1 1 auto!important;
  min-height:0!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior:contain!important;
  padding-bottom:16px!important;
}
.product-editor-head{
  position:sticky!important;
  top:0!important;
  z-index:8!important;
}
.product-editor-head-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto
}
.product-editor-head-actions .product-save-top{
  width:auto!important;
  min-width:86px!important;
  height:31px!important;
  min-height:31px!important;
  padding:5px 10px!important;
  border-radius:8px!important;
  font-size:8px!important;
  font-weight:850!important
}
.product-save-footer{
  position:sticky!important;
  bottom:0!important;
  z-index:9!important;
  flex:0 0 auto!important;
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:12px!important;
  min-height:58px!important;
  padding:9px 11px!important;
  border-top:1px solid #d8c9a8!important;
  background:rgba(255,250,240,.985)!important;
  backdrop-filter:blur(12px)!important;
  box-shadow:0 -8px 28px rgba(65,24,16,.07)!important
}
.product-save-hint{
  min-width:0;
  display:grid;
  gap:2px
}
.product-save-hint b{
  color:var(--px-wine)!important;
  font-size:8px!important
}
.product-save-hint span{
  color:#75675d!important;
  font-size:6px!important;
  line-height:1.35!important
}
.product-save-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto
}
.product-save-actions button{
  width:auto!important;
  min-width:104px!important;
  min-height:36px!important;
  padding:6px 12px!important;
  font-size:8px!important;
  font-weight:850!important
}
.product-save-btn{
  background:linear-gradient(90deg,#68141d,#7b222d)!important;
  color:#fff2d0!important;
  border-color:#68141d!important;
  box-shadow:0 6px 16px rgba(104,20,29,.16)!important
}
.product-save-btn:disabled,
.product-save-top:disabled{
  opacity:.6!important;
  cursor:not-allowed!important
}

@media(max-width:760px){
  #productEditor{
    width:100vw!important;
    max-width:100vw!important;
    height:100dvh!important;
    max-height:100dvh!important;
    margin:0!important;
    border:0!important;
    border-radius:0!important
  }
  #productEditor form{
    height:100dvh!important;
    max-height:100dvh!important
  }
  #productEditor .modal-head-sticky{
    padding-top:calc(8px + env(safe-area-inset-top))!important;
    min-height:calc(50px + env(safe-area-inset-top))!important
  }
  #productEditor .modal-body-pad{
    padding:8px!important;
    padding-bottom:14px!important
  }
  .product-editor-head-actions .product-save-top{
    min-width:74px!important;
    height:34px!important;
    min-height:34px!important;
    font-size:9px!important
  }
  .product-save-footer{
    min-height:calc(62px + env(safe-area-inset-bottom))!important;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom))!important;
    gap:6px!important
  }
  .product-save-hint{
    display:none!important
  }
  .product-save-actions{
    width:100%!important;
    display:grid!important;
    grid-template-columns:1fr 1.35fr!important;
    gap:6px!important
  }
  .product-save-actions button{
    width:100%!important;
    min-width:0!important;
    min-height:42px!important;
    font-size:11px!important;
    border-radius:9px!important
  }
  .product-save-btn{
    font-size:12px!important
  }
}

</style>

css.textContent=`
:root{
 --px-wine:#68141d;
 --px-wine-dark:#430a11;
 --px-wine-mid:#812531;
 --px-gold:#c8942d;
 --px-gold-soft:#f4dfaa;
 --px-paper:#fbf7ee;
 --px-surface:#fffdf8;
 --px-cream:#fffaf0;
 --px-line:#e6dac4;
 --px-line-strong:#d6c294;
 --px-ink:#2b211c;
 --px-muted:#776b61;
 --px-danger:#9f3c31;
 --px-success:#356b4b;
 --px-warning:#8d611b;
}
*{box-sizing:border-box}
body.products-app-page{
 margin:0;
 overflow:hidden;
 background:var(--px-paper)!important;
 color:var(--px-ink)
}
body.products-app-page .top{display:none!important}
body.products-app-page .main{height:100vh;overflow:hidden}
body.products-app-page .content{
 height:100vh;
 max-width:none!important;
 margin:0!important;
 padding:12px 15px 10px!important;
 overflow:hidden!important
}
body.products-app-page #view{
 position:relative;
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
 overflow:hidden
}

/* ---------- Shared desktop sidebar ---------- */
.side .brand:before,.side .brand:after{display:none!important;content:none!important}
.products-side-logo{
 display:block;
 flex:0 0 38px;
 width:38px;
 height:30px;
 object-fit:contain;
 filter:none
}
.products-side-copy{display:grid;min-width:0}
.products-side-copy strong{
 color:#ffe7a3;
 font:700 14px/1.05 Georgia,"Times New Roman",serif;
 letter-spacing:.03em;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.products-side-copy span{
 margin-top:3px;
 color:#d8b75f;
 font-size:6px;
 font-weight:800;
 text-transform:uppercase;
 letter-spacing:.8px;
 white-space:nowrap
}
.products-side-profile{
 display:grid;
 grid-template-columns:30px minmax(0,1fr);
 align-items:center;
 gap:8px;
 width:100%;

 margin:0!important;

body.products-app-page .heading:after{content:none!important;display:none!important}

}

 overflow:visible;

}

 stroke-linecap:round;
 stroke-linejoin:round
}
.products-inf-svg .base{stroke:#ead9aa;stroke-width:6}
.products-inf-svg .flow{

 stroke-width:6;
 stroke-dasharray:1;
 stroke-dashoffset:1;
 animation:productsInfinity 1.55s cubic-bezier(.65,0,.35,1) infinite
}
.products-inf-svg .shine{

 stroke-width:2;
 stroke-dasharray:1;

 opacity:.82
}
@keyframes productsInfinity{
 0%{stroke-dashoffset:1;opacity:.36}
 44%{stroke-dashoffset:0;opacity:1}
 70%{stroke-dashoffset:0;opacity:1}
 100%{stroke-dashoffset:-1;opacity:.3}

 .products-more-links a{
  min-height:36px;
  display:flex;
  align-items:center;
  padding:7px 9px;
  border:1px solid #e8ddc9;
  border-radius:8px;
  background:#fffaf0;
  color:#563c2e;
  text-decoration:none;
  font-size:7.5px;
  font-weight:800
 }
 .products-more-links a.active{
  border-color:#c8942d;
  background:#f6ead3;
  color:var(--px-wine)
 }
 .products-more-signout{
  width:100%;
  min-height:36px!important;
  margin-top:7px;
  border-color:#edc8c0!important;
  background:#fff2ee!important;
  color:#9a3c31!important;
  font-size:7.5px!important
 }

 /* Dialogs become app sheets */
 #productEditor,#stockVoucher{
  width:100vw!important;
  max-width:100vw!important;
  height:min(92dvh,780px)!important;
  max-height:92dvh!important;
  margin:auto 0 0!important;
  border-radius:15px 15px 0 0!important
 }
 #productEditor form,#stockVoucher form{height:100%;max-height:none}
 .modal-head-sticky{padding:9px 10px}
 .modal-head-sticky h2{font-size:14px!important}
 .modal-body-pad{padding:9px}
 .modal-footer{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  padding:8px 9px
 }
 .modal-footer button{
  width:100%;
  min-width:0
 }
 .editor-grid{
  grid-template-columns:1fr;
  gap:7px
 }
 .editor-section,.editor-section.full{grid-column:1}
 .editor-fields{
  grid-template-columns:1fr;
  gap:7px
 }
 .editor-fields .full{grid-column:1}
 .slab-row{
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:8px
 }
 .slab-top,
 .slab-row>label:first-of-type,
 .slab-row>.auto-unit-box,
 .slab-row>.remove-slab,
 .slab-math{grid-column:1/-1}
 .slab-row>.remove-slab{width:100%}
 .slab-math{
  grid-template-columns:1fr 1fr;
  gap:4px
 }
 .plan-metric:last-child{grid-column:1/-1}
 .image-preview{grid-template-columns:1fr 1fr}
 .voucher-grid{grid-template-columns:1fr}
 .voucher-grid .full{grid-column:1}
 .stock-preview{grid-template-columns:1fr 30px 1fr}

 /* Sheet view consumes entire phone screen */
 .sheet-bar{
  height:46px;
  padding:0 7px
 }
 .sheet-bar strong{font-size:8px}
 .sheet-bar small{font-size:5px}
 .sheet-bar button{
  min-height:28px!important;
  padding:3px 5px!important;
  font-size:5.5px!important
 }
 .sheet-active{
  top:46px!important;
  padding:5px!important
 }
 .sheet-active .erp-toolbar{
  position:relative!important;
  right:auto!important;
  bottom:auto!important;
  left:auto!important;
  display:block!important;
  width:100%!important;
  max-height:none!important;
  pointer-events:auto!important;
  opacity:1!important;
  transform:none!important;
  box-shadow:none!important
 }
 body.erp-sheet-mode .products-mobile-appbar,
 body.erp-sheet-mode .products-mobile-bottom{display:none!important}
}

@media(max-width:390px){
 .products-mobile-brand{max-width:calc(100% - 106px)}
 .products-mobile-brand-copy span{display:none}
 .products-mobile-icon{
  flex-basis:28px!important;
  width:28px!important;
  min-width:28px!important;
  max-width:28px!important;
  height:28px!important;
  min-height:28px!important;
  max-height:28px!important
 }
 .products-mobile-avatar img{
  width:28px!important;
  height:28px!important;
  min-width:28px!important;
  max-width:28px!important;
  min-height:28px!important;
  max-height:28px!important
 }
 .erp-kpis{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(3,40px)
 }
 .erp-kpi{
  height:40px;
  min-height:40px
 }
 .mobile-product .plan-stack{grid-template-columns:1fr}
 .mobile-product .plan-chip:nth-child(n+2){display:none}
}

function upgradeProductsShell(){
 document.body.classList.add('products-app-page');
 const brand=document.querySelector('.side .brand');
 if(brand)brand.innerHTML=`<img class="products-side-logo" src="${ONENESS_MARK}" alt="ONeness Group"><span class="products-side-copy"><strong>ONENESS GROUP</strong><span>Lakhpati Didi Program</span></span>`;
 const bottom=document.querySelector('.side .bottom'),logout=document.getElementById('logout');
 if(bottom){
  const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
  const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="Profile photo" loading="eager" decoding="async" onerror="this.remove();this.parentElement.textContent='${esc(initial)}'">`:esc(initial);
  bottom.innerHTML=`<div class="products-side-profile"><div class="products-side-avatar">${avatar}</div><div class="products-side-profile-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div>`;
  if(logout){logout.className='products-side-signout';bottom.append(logout)}
 }
}
upgradeProductsShell();

function buildProductsMobileChrome(){
 const links=[...document.querySelectorAll('.side nav a')].map(a=>({href:a.getAttribute('href'),label:a.textContent.trim(),active:a.classList.contains('active')}));
 const key=x=>String(x.href||'').replace('.html','');
 const preferred=['dashboard','products','orders','payments'];
 const primary=[];
 for(const k of preferred){const x=links.find(v=>key(v)===k);if(x&&!primary.includes(x))primary.push(x)}
 for(const x of links){if(primary.length>=4)break;if(!primary.includes(x)&&key(x)!=='settings')primary.push(x)}
 const initial=String(A.profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
 const avatar=A.profile?.avatar_url?`<img src="${esc(A.profile.avatar_url)}" alt="Profile photo" loading="eager" decoding="async" onerror="this.remove();this.parentElement.textContent='${esc(initial)}'">`:esc(initial);

 const appbar=document.createElement('header');
 appbar.className='products-mobile-appbar';
 appbar.innerHTML=`<div class="products-mobile-brand"><img src="${ONENESS_MARK}" alt="ONeness"><span class="products-mobile-brand-copy"><b>ONENESS GROUP</b><span>Products & Inventory</span></span></div><div class="products-mobile-top-actions">${canCreate?'<button id="products-mobile-add-top" class="products-mobile-icon" aria-label="Add product">＋</button>':''}<button id="products-mobile-filter" class="products-mobile-icon" aria-label="Filters">⌁</button><button id="products-mobile-profile" class="products-mobile-icon products-mobile-avatar" aria-label="Account">${avatar}</button></div>`;
 document.body.append(appbar);

 const nav=document.createElement('nav');
 nav.className='products-mobile-bottom';
 nav.innerHTML=primary.map(x=>`<a class="products-mobile-nav ${x.active?'active':''}" href="${esc(x.href)}">${productsIcon(key(x))}<span>${esc(x.label)}</span></a>`).join('')+`<button id="products-mobile-more-btn" class="products-mobile-nav more">${productsIcon('more')}<span>More</span></button>`;
 document.body.append(nav);

 const backdrop=document.createElement('div');
 backdrop.className='products-mobile-backdrop';
 backdrop.id='products-mobile-backdrop';
 document.body.append(backdrop);

 const more=document.createElement('section');
 more.className='products-mobile-more';
 more.id='products-mobile-more';
 more.innerHTML=`<div class="products-more-profile"><div class="products-more-avatar">${avatar}</div><div class="products-more-copy"><b>${esc(A.profile?.name||'Administrator')}</b><span>${esc(A.profile?.role||'admin')}</span></div></div><div class="products-more-links">${links.map(x=>`<a class="${x.active?'active':''}" href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div><button id="products-mobile-signout" class="products-more-signout">Sign out</button>`;
 document.body.append(more);

 const close=()=>{
  more.classList.remove('open');
  document.querySelectorAll('.erp-toolbar.mobile-open').forEach(x=>x.classList.remove('mobile-open'));
  backdrop.classList.remove('show');
 };
 const openMore=()=>{close();more.classList.add('open');backdrop.classList.add('show')};
 const openFilter=()=>{
  close();
  const toolbar=document.querySelector(tab==='inventory'?'#inventory-view .erp-toolbar':'#catalogue-view .erp-toolbar');
  toolbar?.classList.add('mobile-open');backdrop.classList.add('show');
 };

 document.getElementById('products-mobile-more-btn').onclick=openMore;
 document.getElementById('products-mobile-profile').onclick=openMore;
 document.getElementById('products-mobile-filter').onclick=openFilter;
 document.getElementById('products-mobile-signout').onclick=()=>document.getElementById('logout')?.click();
 backdrop.onclick=close;
 if(document.getElementById('products-mobile-add-top'))document.getElementById('products-mobile-add-top').onclick=()=>openEditor();
 window.__closeProductsSheets=close;
}

function installProductsTransition(){
 const overlay=document.createElement('div');
 overlay.className='products-page-transition';
 overlay.innerHTML=`<div style="display:grid;justify-items:center;gap:9px"><img src="${ONENESS_MARK}" alt="" style="width:70px;height:43px;object-fit:contain"><svg class="products-inf-svg" viewBox="0 0 100 58" aria-hidden="true"><defs><linearGradient id="productsGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a56e15"/><stop offset=".46" stop-color="#f0cf72"/><stop offset="1" stop-color="#b77b1c"/></linearGradient></defs><path pathLength="1" class="base" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="flow" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="shine" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/></svg><div style="font-size:7px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#987837">Opening page</div></div>`;
 document.body.append(overlay);

 document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a||a.target==='_blank'||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
  let u;try{u=new URL(a.href,location.href)}catch{return}
  if(u.origin===location.origin&&u.pathname!==location.pathname)overlay.classList.add('show');
 });

 for(const href of [...document.querySelectorAll('a[href]')].map(a=>a.href)){
  try{const u=new URL(href,location.href);if(u.origin===location.origin&&u.pathname.endsWith('.html')){const l=document.createElement('link');l.rel='prefetch';l.href=u.href;document.head.append(l)}}catch{}
 }
}

    <table class="erp-table">
     <thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Wholesale / MRP</th><th>Stock</th><th>Low Stock Alert</th><th>Qty Offers</th><th>Status</th><th>Actions</th></tr></thead>
     <tbody id="product-body"></tbody>
    </table>
   </div>
 </div>
 <div id="mobile-products" class="mobile-products"></div>
</section>

<section id="inventory-view" hidden>
 <div class="erp-toolbar">
  <div class="erp-filter-grid">
   <label class="wide">Search statement<input id="ledger-search" placeholder="Product, reference or note"></label>
   <label>Product<select id="ledger-product"><option value="">All products</option></select></label>
   <label>Movement<select id="ledger-type"><option value="">All movements</option><option value="opening">Opening balance</option><option value="purchase">Purchase / Stock In</option><option value="return_in">Return In</option><option value="adjustment_in">Adjustment In</option><option value="adjustment_out">Adjustment Out</option><option value="damage">Damage / Loss</option><option value="correction">Correction</option><option value="order_reserved">Order Reserved</option><option value="order_cancelled">Order Cancelled / Restored</option><option value="product_edit">Legacy product edit</option></select></label>
   <label>From<input id="ledger-from" type="date"></label>
   <label>Through<input id="ledger-to" type="date"></label>
  </div>
  <div class="quick-date">
    <button data-period="today">Today</button><button data-period="7">Last 7 days</button><button data-period="month">This month</button><button data-period="all">All dates</button>
  </div>
  <div class="toolbar-actions">
    <button id="ledger-refresh" class="primary">Run Statement</button>
    ${canStock?'<button id="ledger-stock-in" class="stock-in">+ Stock In</button><button id="ledger-stock-out" class="stock-out">− Stock Out</button>':''}
    <button id="ledger-export">Export Statement</button><button id="ledger-print">Print Statement</button>
  </div>
 </div>

 <div class="inventory-headline">
  <div>
   <div id="statement-title" class="statement-title">Inventory Statement · All Products</div>
   <div id="statement-sub" class="statement-sub">Live stock movement register</div>
  </div>
  <div class="inventory-head-right"><span id="ledger-count" class="inventory-count">0 movements</span></div>
 </div>

 <div hidden>
  <span id="sum-transactions">0</span>
  <span id="sum-in">0</span>
  <span id="sum-out">0</span>
  <span id="sum-net">0</span>
  <span id="sum-opening">0</span>
  <span id="sum-closing">0</span>
  <div id="period-opening-card" hidden></div>
  <div id="period-closing-card" hidden></div>
 </div>
 <div class="inventory-ledger-shell">
  <div class="inventory-ledger-note"><span>▦</span><div><b>Inventory transactions</b><small>Chronological stock movement ledger</small></div></div>
  <div class="erp-table-wrap inventory-table-wrap">
   <table class="erp-table inventory-table">
    <thead><tr><th>Date & time</th><th>Product</th><th>Movement</th><th>Reference</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th><th>Staff / Source</th><th>Note</th></tr></thead>
    <tbody id="ledger-body"></tbody>
   </table>
   <div id="ledger-empty" class="ledger-empty" hidden><div class="ledger-empty-icon">▦</div><b>No inventory movements</b><span>No transactions match the selected filters.</span></div>
  </div>
 </div>
 <p class="inventory-footnote">Opening balances mark the point inventory tracking was enabled. Earlier historical stock movements are not reconstructed.</p>
</section>

<dialog id="productEditor">
 <div class="modal-head-sticky product-editor-head">
  <div><h2 id="editor-title" style="margin:0">Product</h2><small id="editor-subtitle"></small></div>
  <div class="product-editor-head-actions">
   <button type="button" id="editor-save-top" class="primary product-save-top">Save</button>
   <button type="button" id="editor-close" aria-label="Close product editor">×</button>
  </div>
 </div>
 <form id="product-form">
  <div class="modal-body-pad">
   <div class="editor-grid">
    <section class="editor-section">
     <h3>Product details</h3>
     <div class="editor-fields">
      <label class="full">Product name · English<input id="ed-title" required maxlength="180" placeholder="Master product title"></label>
      <label>Category<select id="ed-category" required></select></label>
      <label>Unit<input id="ed-unit" required maxlength="30" placeholder="piece"></label>
      <label class="full">Description · English<textarea id="ed-description" maxlength="2000" placeholder="Master product description"></textarea></label>

      <div class="product-language-box">
       <div class="product-language-head">
        <div><h4>Customer language content</h4><p>English is the master. Hindi and Marathi are saved with this product and can be edited before saving.</p></div>
        <div class="product-language-actions">
         <button id="translate-hi" type="button">Generate हिन्दी</button>
         <button id="translate-mr" type="button">Generate मराठी</button>
         <button id="translate-both" class="primary" type="button">Generate both</button>
        </div>
       </div>
       <div id="translation-status" class="product-language-status">English content is always used as the fallback if a translation is empty.</div>
       <div class="language-tabs">
        <button class="language-tab active" type="button" data-lang-tab="hi">हिन्दी</button>
        <button class="language-tab" type="button" data-lang-tab="mr">मराठी</button>
       </div>
       <div class="language-panel active" data-lang-panel="hi">
        <div class="language-panel-grid">
         <label>Product name · हिन्दी<input id="ed-title-hi" maxlength="180" lang="hi" placeholder="Hindi product title"></label>
         <label>Description · हिन्दी<textarea id="ed-description-hi" maxlength="2000" lang="hi" placeholder="Hindi product description"></textarea></label>
         <div class="language-note">Brand names, model numbers, units and technical product codes should remain unchanged where appropriate. You can edit the generated translation before saving.</div>
        </div>
       </div>
       <div class="language-panel" data-lang-panel="mr">
        <div class="language-panel-grid">
         <label>Product name · मराठी<input id="ed-title-mr" maxlength="180" lang="mr" placeholder="Marathi product title"></label>
         <label>Description · मराठी<textarea id="ed-description-mr" maxlength="2000" lang="mr" placeholder="Marathi product description"></textarea></label>
         <div class="language-note">ब्रँड नाव, मॉडेल नंबर, युनिट आणि तांत्रिक कोड शक्यतो जसाचे तसे ठेवा. सेव्ह करण्यापूर्वी तयार झालेला अनुवाद बदलता येतो.</div>
        </div>
       </div>
       <label class="language-auto-row"><input id="ed-auto-translate" type="checkbox" checked> Automatically generate any missing Hindi/Marathi translation when saving.</label>
      </div>
     </div>
    </section>

    <section class="editor-section">
     <h3>Pricing & stock alert</h3>
     <div class="editor-fields">
      <label>MRP (₹)<input id="ed-mrp" type="number" min="0" step="0.01" required ${canPrice?'':'disabled'}></label>
      <label>Standard wholesale price / unit (₹)<input id="ed-price" type="number" min="0" step="0.01" required ${canPrice?'':'disabled'}></label>
      <label>Low stock alert qty<input id="ed-alert" type="number" min="0" step="1" required><small class="muted">Warning starts when current stock reaches this quantity.</small></label>
      <div class="full read-stock"><span id="stock-caption">Stock</span><strong id="ed-stock-display">0</strong><small id="stock-help">Existing stock is changed only through Inventory Vouchers.</small></div>
      <label id="opening-stock-wrap" class="full">Opening stock<input id="ed-opening-stock" type="number" min="0" step="1" value="0"></label>
     </div>
    </section>

    <section class="editor-section full">
     <div class="row between"><div><h3 style="margin-bottom:3px">Quantity-based wholesale offers</h3><small>Create named blocks such as Startup Plan or Advance Plan. Enter the <b>total price of the complete block</b>; ONeness calculates the per-unit price automatically.</small></div><button type="button" id="add-slab">+ Add offer</button></div>
     <div id="slab-list" class="slab-list" style="margin-top:11px"></div><div class="plan-explainer"><b>Example:</b> Startup Plan = 20 units for <b>₹400 total</b>. Enter ₹400 — not ₹20. ONeness calculates ₹20/unit automatically. If MRP is ₹40/unit, retail value is ₹800 and potential profit is ₹400 (50%).</div>
    </section>

    <section class="editor-section full">
     <div class="row between"><div><h3 style="margin-bottom:3px">Product images</h3><small>Up to 6 images. The first image is used as the primary catalogue image.</small></div><span id="image-count" class="muted">0 / 6</span></div>
     <label class="image-drop" for="ed-upload"><div><b>+ Add product images</b><span>JPG, PNG or WebP · large images are optimized before upload</span></div></label>
     <input id="ed-upload" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
     <div id="image-preview" class="image-preview"></div>
    </section>

    <section class="editor-section full">
     <h3>Availability & audit</h3>
     <label><input id="ed-active" type="checkbox" style="width:auto;min-height:auto" ${canDeactivate?'':'disabled'}> Available for ordering</label>
     <label id="reason-wrap">Reason for change<input id="ed-reason" maxlength="500" placeholder="Example: price revision / catalogue correction"></label>
    </section>
   </div>
   <p id="editor-error" class="notice error" hidden></p>
  </div>
  <div class="modal-footer product-save-footer">
   <div class="product-save-hint"><b>Ready to save?</b><span>English is the master content. Hindi/Marathi translations are stored with the same product.</span></div>
   <div class="product-save-actions">
    <button type="button" id="editor-cancel">Cancel</button>
    <button class="primary product-save-btn" id="editor-save" type="submit">Save Product</button>
   </div>
  </div>
 </form>
</dialog>

<dialog id="stockVoucher">
 <div class="modal-head-sticky"><div><h2 id="voucher-title" style="margin:0">Stock In</h2><small>Inventory voucher · every change is recorded in the ledger</small></div><button id="voucher-close">×</button></div>
 <form id="voucher-form">
  <div class="modal-body-pad">
   <div class="voucher-grid">
    <label class="full">Find product<input id="voucher-search" placeholder="Search product name or ID"></label>
    <label class="full">Product<select id="voucher-product" required></select></label>
    <label>Movement type<select id="voucher-type" required></select></label>
    <label>Quantity<input id="voucher-qty" type="number" min="1" step="1" required value="1"></label>
    <label>Transaction date & time<input id="voucher-date" type="datetime-local"></label>
    <label>Reference / Invoice No.<input id="voucher-reference" maxlength="120" placeholder="PO-125 / INV-44 / optional"></label>
    <label class="full">Narration / Note<textarea id="voucher-note" maxlength="1000" placeholder="Supplier receipt, damage reason, physical count correction, etc."></textarea></label>
    <div class="full stock-preview">
      <div><span>Current stock</span><strong id="voucher-current">0</strong></div>
      <div class="stock-arrow">→</div>
      <div><span>Closing stock</span><strong id="voucher-closing">0</strong></div>
    </div>
   </div>
   <p id="voucher-error" class="notice error" hidden></p>
  </div>
  <div class="modal-footer"><button type="button" id="voucher-cancel">Cancel</button><button id="voucher-save" class="primary" type="submit">Post Inventory Voucher</button></div>
 </form>
</dialog>
`;
buildProductsMobileChrome();
installProductsTransition();

const productEditor=$('productEditor'),stockVoucher=$('stockVoucher');

function categoryName(id){return categories.find(c=>+c.id===+id)?.name||'Uncategorised'}
function movementLabel(t){return ({opening:'Opening Balance',purchase:'Purchase / Stock In',return_in:'Return In',adjustment_in:'Adjustment In',adjustment_out:'Adjustment Out',damage:'Damage / Loss',correction:'Correction',order_reserved:'Order Reserved',order_cancelled:'Order Cancelled / Restored',product_edit:'Product Edit'})[t]||String(t||'—').replaceAll('_',' ')}
function formatDate(v){return v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}):'—'}
function rupeeInput(p){return Number(p||0)/100}
function thumb(p){return p.images?.[0]?`<img class="product-thumb" loading="lazy" src="${esc(p.images[0])}" alt="">`:'<div class="product-placeholder">◇</div>'}
async function uploadProductImage(base64,name){
 const {data,error}=await A.client.functions.invoke('product-image-upload',{body:{base64,name}});
 if(error){
   let message=error.message||'Image upload failed.';
   try{const body=await error.context?.json?.();message=body?.error?.message||message}catch{}
   throw Error(message);
 }
 if(data?.ok!==true||!data?.data?.url)throw Error(data?.error?.message||'Image upload was not confirmed.');
 return data.data;
}
async function inventoryAdjust(data){
 const {data:result,error}=await A.client.rpc('admin_inventory_adjust',{p_data:data});
 if(error)throw error;return result;
}
async function inventoryAll(data){
 const list=[];let before=null;
 for(let i=0;i<100;i++){
   const payload={...data,limit:250,...(before?{before_id:before}:{})};
   const {data:result,error}=await A.client.rpc('admin_inventory_statement',{p_data:payload});
   if(error)throw error;
   const batch=Array.isArray(result?.items)?result.items:[];list.push(...batch);
   const next=result?.next_before_id;if(!next||!batch.length)break;before=next;
 }
 return list;
}

async function loadProducts(){
 products=await A.all('products.list',{},n=>$('product-count').textContent=`Loaded ${n} products…`);
 categories=await A.api('categories.list');
 const opts='<option value="">All categories</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('product-category').innerHTML=opts;
 $('ledger-product').innerHTML='<option value="">All products</option>'+products.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(p=>`<option value="${p.id}">#${p.id} · ${esc(p.title)}</option>`).join('');
 renderCatalogue();
}

function productRows(){
 let rows=[...products];
 const q=$('product-search').value.trim().toLowerCase();
 if(q)rows=rows.filter(p=>`${p.id} ${p.title} ${p.description||''}`.toLowerCase().includes(q));
 if($('product-category').value)rows=rows.filter(p=>+p.category_id===+$('product-category').value);
 const f=$('stock-filter').value;
 if(f==='in')rows=rows.filter(p=>p.active&&p.stock>0);
 if(f==='low')rows=rows.filter(p=>p.active&&p.stock>0&&p.stock<=Number(p.low_stock_alert_qty??10));
 if(f==='out')rows=rows.filter(p=>p.stock===0);
 if(f==='inactive')rows=rows.filter(p=>!p.active);
 const s=$('product-sort').value;
 if(s==='name')rows.sort((a,b)=>a.title.localeCompare(b.title));
 else if(s==='stock-low')rows.sort((a,b)=>a.stock-b.stock);
 else if(s==='stock-high')rows.sort((a,b)=>b.stock-a.stock);
 else if(s==='price')rows.sort((a,b)=>a.price_paise-b.price_paise);
 else rows.sort((a,b)=>b.id-a.id);
 return rows;
}

function defaultPlanTitle(index){return ['Startup Plan','Growth Plan','Advance Plan','Premium Plan','Mega Plan'][index]||`Bulk Plan ${index+1}`}
function planData(rule,p,index=0){
 const units=Math.max(1,Number(rule?.units||rule?.min_qty||1));
 const total=Number(rule?.total_price_paise ?? (Number(rule?.price_paise||0)*units));
 const unitPrice=units?Math.round(total/units):0;
 const mrpTotal=Number(p?.mrp_paise||0)*units;
 const profit=mrpTotal-total;
 const margin=mrpTotal?profit*100/mrpTotal:0;
 const stdTotal=Number(p?.price_paise||0)*units;
 const saving=stdTotal-total;
 return {title:String(rule?.title||rule?.plan_title||defaultPlanTitle(index)),units,total,unitPrice,mrpTotal,profit,margin,saving};
}
function plansHtml(p){
 const rules=p.bulk_rules||[];
 if(!rules.length)return '<span class="muted">No quantity offers</span>';
 return `<div class="plan-stack">${rules.map((r,i)=>{const x=planData(r,p,i);return `<div class="plan-chip"><b>${esc(x.title)}</b><span class="plan-price">${x.units} units · ${money(x.total)} total</span><span class="plan-meta">${money(x.unitPrice)}/unit · MRP value ${money(x.mrpTotal)}</span><span class="plan-profit">Potential ${money(x.profit)} (${pctPlan(x.margin)})</span></div>`}).join('')}</div>`;
}
function pctPlan(v){const n=Number(v||0);return `${n.toFixed(Number.isInteger(n)?0:1)}%`}

function productLanguageStatus(p){
 const t=p?.translations||{};
 const hi=Boolean(String(t?.hi?.title||'').trim());
 const mr=Boolean(String(t?.mr?.title||'').trim());
 return `<span class="lang-completeness"><span class="lang-dot done">EN</span><span class="lang-dot ${hi?'done':''}">HI${hi?' ✓':''}</span><span class="lang-dot ${mr?'done':''}">MR${mr?' ✓':''}</span></span>`;
}

function plansCompactHtml(p,max=2){
 const rules=Array.isArray(p.bulk_rules)?p.bulk_rules:[];
 if(!rules.length)return '<span class="muted">No offers</span>';
 const visible=rules.slice(0,max);
 return `<div class="plan-stack">${visible.map((r,i)=>{
  const x=planData(r,p,i);
  return `<div class="plan-chip"><b>${esc(x.title)}</b><span class="plan-price">${x.units} units · ${money(x.total)}</span><span class="plan-profit">Potential ${money(x.profit)} (${pctPlan(x.margin)})</span></div>`;
 }).join('')}${rules.length>max?`<span class="plan-more">+${rules.length-max} more offer${rules.length-max===1?'':'s'}</span>`:''}</div>`;
}

function renderCatalogue(){
 const rows=productRows();
 const totalUnits=products.reduce((a,p)=>a+Number(p.stock||0),0);
 const low=products.filter(p=>p.active&&p.stock>0&&p.stock<=Number(p.low_stock_alert_qty??10)).length;
 const out=products.filter(p=>p.stock===0).length;
 const wholesaleValue=products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.price_paise||0),0);
 const mrpValue=products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.mrp_paise||0),0);

 $('catalogue-kpis').innerHTML=[
  ['Total SKUs',products.length,'Catalogue products','accent'],
  ['Active',products.filter(p=>p.active).length,'Available for ordering',''],
  ['Units on hand',totalUnits,'Current physical stock',''],
  ['Low stock',low,'At or below alert qty','warn'],
  ['Out of stock',out,'Needs replenishment','bad'],
  ['Stock value',money(wholesaleValue),`MRP value ${money(mrpValue)}`,'']
 ].map(([l,v,h,c])=>`<article class="erp-kpi ${c}"><span>${l}</span><strong>${esc(v)}</strong><small>${esc(h)}</small></article>`).join('');

 $('product-count').textContent=`${rows.length} matching products · ${totalUnits} total units on hand`;

 $('product-body').innerHTML=rows.map(p=>`
  <tr>
   <td><b>#${p.id}</b></td>
   <td><div class="product-cell">${thumb(p)}<div><span class="product-title">${esc(p.title)}</span><span class="product-desc">${esc(p.description||'')}</span>${productLanguageStatus(p)}</div></div></td>
   <td>${esc(categoryName(p.category_id))}</td>
   <td><b>${money(p.price_paise)}</b><span class="stock-unit">MRP ${money(p.mrp_paise)}</span></td>
   <td><span class="stock-number ${p.stock===0?'out':p.stock<=Number(p.low_stock_alert_qty??10)?'low':''}">${p.stock}</span><span class="stock-unit">${esc(p.unit)}</span></td>
   <td><div class="alert-cell"><b>${Number(p.low_stock_alert_qty??10)} ${esc(p.unit)}</b><span class="alert-badge ${p.stock===0?'out':p.stock<=Number(p.low_stock_alert_qty??10)?'low':''}">${p.stock===0?'Out of stock':p.stock<=Number(p.low_stock_alert_qty??10)?'Alert active':'Healthy'}</span></div></td>
   <td>${plansCompactHtml(p,2)}</td>
   <td>${A.badge(p.active?'active':'inactive')}</td>
   <td><div class="erp-actions">
    <button data-view="${p.id}">Details</button>
    ${canStock?`<button data-stock="${p.id}" class="stock-in">Stock</button>`:''}
    <button data-statement="${p.id}">Statement</button>
    ${canEdit?`<button data-edit="${p.id}" class="primary">Edit</button>`:''}
   </div></td>
  </tr>`).join('');

 $('mobile-products').innerHTML=rows.map(p=>`
  <article class="mobile-product">
   <div class="mobile-product-head">${thumb(p)}<div><b>${esc(p.title)}</b><span class="stock-unit">#${p.id} · ${esc(categoryName(p.category_id))}</span><span class="product-desc">${esc(p.description||'')}</span>${productLanguageStatus(p)}</div>${A.badge(p.active?'active':'inactive')}</div>
   <div class="mobile-metrics">
    <div class="mobile-metric"><span>Wholesale</span><strong>${money(p.price_paise)}</strong></div>
    <div class="mobile-metric"><span>MRP</span><strong>${money(p.mrp_paise)}</strong></div>
    <div class="mobile-metric"><span>Stock / Alert</span><strong>${p.stock} / ${Number(p.low_stock_alert_qty??10)}</strong></div>
   </div>
   <div class="mobile-offer-title">Quantity offers</div><div>${plansCompactHtml(p,2)}</div>
   <div class="toolbar-actions"><button data-view="${p.id}">Details</button>${canStock?`<button data-stock="${p.id}" class="stock-in">Stock</button>`:''}<button data-statement="${p.id}">Statement</button>${canEdit?`<button data-edit="${p.id}" class="primary">Edit</button>`:''}</div>
  </article>`).join('')||'<div class="card empty">No products match your filters.</div>';

 wireProductActions();
}

function wireProductActions(){
 for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>showDetails(products.find(p=>p.id===+b.dataset.view));
 for(const b of document.querySelectorAll('[data-edit]'))b.onclick=()=>openEditor(products.find(p=>p.id===+b.dataset.edit));
 for(const b of document.querySelectorAll('[data-stock]'))b.onclick=()=>openVoucher('in',+b.dataset.stock);
 for(const b of document.querySelectorAll('[data-statement]'))b.onclick=()=>openProductStatement(+b.dataset.statement);
}

function showDetails(p){
 const slabs=(p.bulk_rules||[]).length?A.table(['Offer','Block Qty','Total Block Price','Auto / Unit','MRP Value','Potential Profit'],p.bulk_rules.map((t,i)=>{const x=planData(t,p,i);return [esc(x.title),`${x.units} ${esc(p.unit)}`,money(x.total),money(x.unitPrice),money(x.mrpTotal),`${money(x.profit)} (${pctPlan(x.margin)})`]})):'<p class="muted">No wholesale bundle plans.</p>';
 const gallery=(p.images||[]).length?`<div class="image-preview" style="margin-bottom:14px">${p.images.map((u,i)=>`<div class="image-card"><img src="${esc(u)}" alt="">${i===0?'<span class="primary-image">Primary</span>':''}</div>`).join('')}</div>`:'';
 A.modal(p.title,`
  ${gallery}<div class="detail-grid">
   <div class="card"><small>Current stock</small><h2>${p.stock} ${esc(p.unit)}</h2></div>
   <div class="card"><small>Wholesale / MRP</small><h2>${money(p.price_paise)} / ${money(p.mrp_paise)}</h2></div>
  </div>
  <p>${esc(p.description||'No description')}</p>
  <p>Category: <b>${esc(categoryName(p.category_id))}</b> · Low stock alert at <b>${Number(p.low_stock_alert_qty??10)} ${esc(p.unit)}</b></p>
  <h3>Quantity-based wholesale offers</h3>${slabs}
  <div class="row" style="margin-top:18px">
    ${canStock?`<button id="detail-stock-in" class="stock-in">+ Stock In</button><button id="detail-stock-out" class="stock-out">− Stock Out</button>`:''}

 const unit=units?Math.round(total/units):0,mrpTotal=mrp*units,profit=mrpTotal-total,margin=mrpTotal?profit*100/mrpTotal:0,saving=std*units-total;

async function imageToBase64(file){
 const local=URL.createObjectURL(file);
 try{
   const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Could not read this image.'));im.src=local});
   let w=img.naturalWidth,h=img.naturalHeight;
   const max=1800,scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
   let data=canvas.toDataURL('image/webp',.86);
   if(data.length>2_600_000){data=canvas.toDataURL('image/webp',.72)}
   if(data.length>2_600_000){const smaller=document.createElement('canvas');const s=Math.min(1,1200/Math.max(w,h));smaller.width=Math.max(1,Math.round(w*s));smaller.height=Math.max(1,Math.round(h*s));smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);data=smaller.toDataURL('image/webp',.72)}
   const base64=String(data).split(',')[1];
   if(!base64||base64.length>2_800_000)throw Error('This image is still too large after optimization. Choose a smaller image.');
   return base64;
 }finally{URL.revokeObjectURL(local)}
}
async function uploadEditorImages(){
 for(let i=0;i<editorImages.length;i++){
   const img=editorImages[i];if(img.url)continue;
   img.status='uploading';renderEditorImages();
   try{
     const base64=await imageToBase64(img.file);
     let uploaded=null,lastErr=null;
     for(let attempt=0;attempt<2&&!uploaded;attempt++){
       try{uploaded=await uploadProductImage(base64,img.name||'product-image')}catch(e){lastErr=e;if(attempt===0)await new Promise(r=>setTimeout(r,900))}
     }
     if(!uploaded?.url)throw lastErr||Error('Image upload was not confirmed.');
     if(img.localUrl)URL.revokeObjectURL(img.localUrl);
     img.url=uploaded.url;img.preview=uploaded.thumbnail||uploaded.url;img.localUrl=null;img.file=null;img.status='saved';renderEditorImages();
   }catch(e){img.status='error';renderEditorImages();throw Error(`Image ${i+1} (${img.name||'product image'}): ${e?.message||'upload failed'}`)}
 }
 return editorImages.map(x=>x.url).filter(Boolean);
}

const TRANSLATE_ENDPOINT_PRIMARY='https://translate.googleapis.com/translate_a/single';
const TRANSLATE_ENDPOINT_FALLBACK='https://api.mymemory.translated.net/get';

async function fetchTranslationJson(url,timeout=6500){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeout);
 try{
  const res=await fetch(url,{signal:controller.signal,cache:'no-store'});
  if(!res.ok)throw Error(`Translation service returned ${res.status}.`);
  return await res.json();
 }finally{clearTimeout(timer)}
}
async function translateAdminText(value,target){
 const source=String(value||'').trim();
 if(!source)return '';
 try{
  const q=new URLSearchParams({client:'gtx',sl:'en',tl:target,dt:'t',q:source});
  const data=await fetchTranslationJson(`${TRANSLATE_ENDPOINT_PRIMARY}?${q}`,6500);
  const result=Array.isArray(data?.[0])?data[0].map(x=>Array.isArray(x)?x[0]||'':'').join('').trim():'';
  if(result)return result;
 }catch{}
 try{
  const q=new URLSearchParams({q:source,langpair:`en|${target}`});
  const data=await fetchTranslationJson(`${TRANSLATE_ENDPOINT_FALLBACK}?${q}`,7000);
  const result=String(data?.responseData?.translatedText||'').trim();
  if(result)return result;
 }catch{}
 throw Error(`Could not generate ${target==='hi'?'Hindi':'Marathi'} translation. You can type it manually and save.`);
}
function translationStatus(message,tone=''){
 const el=$('translation-status');
 if(!el)return;
 el.className=`product-language-status ${tone}`.trim();
 el.textContent=message;
}
function translationsPayload(){
 const hiTitle=$('ed-title-hi').value.trim(),hiDescription=$('ed-description-hi').value.trim();
 const mrTitle=$('ed-title-mr').value.trim(),mrDescription=$('ed-description-mr').value.trim();
 const out={};
 if(hiTitle||hiDescription)out.hi={title:hiTitle,description:hiDescription};
 if(mrTitle||mrDescription)out.mr={title:mrTitle,description:mrDescription};
 return out;
}
async function generateProductTranslation(lang,{onlyMissing=false}={}){
 const sourceTitle=$('ed-title').value.trim();
 const sourceDescription=$('ed-description').value.trim();
 if(!sourceTitle)throw Error('Enter the English product name first.');
 const titleInput=$(lang==='hi'?'ed-title-hi':'ed-title-mr');
 const descInput=$(lang==='hi'?'ed-description-hi':'ed-description-mr');
 if(!onlyMissing||!titleInput.value.trim()){
  titleInput.value=await translateAdminText(sourceTitle,lang);
 }
 if(sourceDescription&&(!onlyMissing||!descInput.value.trim())){
  descInput.value=await translateAdminText(sourceDescription,lang);
 }
}
async function generateTranslations(langs=['hi','mr'],opts={}){
 const buttons=[$('translate-hi'),$('translate-mr'),$('translate-both')].filter(Boolean);
 buttons.forEach(b=>b.disabled=true);
 translationStatus(`Generating ${langs.length===2?'Hindi and Marathi':langs[0]==='hi'?'Hindi':'Marathi'}…`,'loading');
 try{
  const results=await Promise.allSettled(langs.map(lang=>generateProductTranslation(lang,opts)));
  const failed=results.filter(x=>x.status==='rejected');
  if(failed.length===results.length)throw failed[0].reason;
  if(failed.length){
   translationStatus('Some translations could not be generated. Review the fields and edit them manually if needed.','warn');
  }else{
   translationStatus('Translations generated. Review them if needed, then save the product.','good');
  }
 }finally{
  buttons.forEach(b=>b.disabled=false);
 }
}

 return delta>0?'tone-in':delta<0?'tone-out':'tone-opening';
}
function movementRowClass(delta){return delta>0?'row-in':delta<0?'row-out':'row-neutral'}
function renderLedger(){
 const selected=products.find(p=>p.id===+$('ledger-product').value);
 const totalIn=ledger.filter(x=>x.quantity_delta>0).reduce((a,x)=>a+x.quantity_delta,0);
 const totalOut=ledger.filter(x=>x.quantity_delta<0).reduce((a,x)=>a+Math.abs(x.quantity_delta),0);
 $('sum-transactions').textContent=ledger.length;$('sum-in').textContent='+'+totalIn;$('sum-out').textContent='−'+totalOut;$('sum-net').textContent=(totalIn-totalOut>=0?'+':'')+(totalIn-totalOut);
 $('statement-title').textContent=selected?`Inventory Statement · ${selected.title}`:'Inventory Statement · All Products';
 $('statement-sub').textContent=`${$('ledger-from').value||'Beginning'} through ${$('ledger-to').value||'Today'} · ${$('ledger-type').selectedOptions[0].text}`;
 $('ledger-count').textContent=`${ledger.length} movement${ledger.length===1?'':'s'}`;

 if(selected&&ledger.length){
   const chronological=[...ledger].sort((a,b)=>new Date(a.occurred_at)-new Date(b.occurred_at)||a.id-b.id);
   $('period-opening-card').hidden=false;$('period-closing-card').hidden=false;
   $('sum-opening').textContent=`${chronological[0].stock_before} ${selected.unit}`;
   $('sum-closing').textContent=`${chronological.at(-1).stock_after} ${selected.unit}`;
 }else{
   $('period-opening-card').hidden=true;$('period-closing-card').hidden=true;
 }

 $('ledger-body').innerHTML=ledger.map(x=>`
  <tr class="${movementRowClass(x.quantity_delta)}">
   <td>${esc(formatDate(x.occurred_at))}</td>
   <td><b>${esc(x.product_title)}</b><span class="stock-unit">#${x.product_id}</span></td>
   <td><span class="movement-type ${movementTone(x.movement_type,x.quantity_delta)}">${esc(movementLabel(x.movement_type))}</span></td>
   <td><span class="movement-ref">${esc(x.reference_id||'—')}</span></td>
   <td><span class="ledger-stock">${x.stock_before}</span></td>
   <td class="movement-in">${x.quantity_delta>0?'+'+x.quantity_delta:'—'}</td>
   <td class="movement-out">${x.quantity_delta<0?'−'+Math.abs(x.quantity_delta):'—'}</td>
   <td><span class="ledger-stock closing">${x.stock_after}</span></td>
   <td>${esc(x.actor_name||x.actor_role||'System')}</td>
   <td class="movement-note">${esc(x.note||'—')}</td>
  </tr>`).join('');
 $('ledger-empty').hidden=ledger.length>0;
}

function syncSheetActive(){
 for(const id of ['catalogue-view','inventory-view'])$(id)?.classList.remove('sheet-active');
 if(sheetMode){const active=$(tab==='inventory'?'inventory-view':'catalogue-view');active?.classList.add('sheet-active');$('sheet-context').textContent=tab==='inventory'?'Inventory ledger · Excel-style':'Product catalogue · Excel-style';$('sheet-catalogue').classList.toggle('active',tab==='catalogue');$('sheet-inventory').classList.toggle('active',tab==='inventory')}
}
function enterSheetView(){sheetMode=true;document.body.classList.add('erp-sheet-mode');$('erp-sheet-bar').hidden=false;syncSheetActive()}
function exitSheetView(){sheetMode=false;document.body.classList.remove('erp-sheet-mode');$('erp-sheet-bar').hidden=true;for(const id of ['catalogue-view','inventory-view'])$(id)?.classList.remove('sheet-active')}
function showTab(next){
 tab=next;
 window.__closeProductsSheets?.();
 for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);
 $('catalogue-view').hidden=tab!=='catalogue';$('inventory-view').hidden=tab!=='inventory';
 if(tab==='inventory')loadLedger().catch(A.error);
 syncSheetActive();
}
async function openProductStatement(id){
 $('ledger-product').value=id;showTab('inventory');
 if(!matchMedia('(max-width:850px)').matches)document.querySelector('[data-tab="inventory"]').scrollIntoView({behavior:'smooth',block:'start'});
}

function exportProducts(){
 const rows=productRows();
 A.csv('Products',['ID','Product','Category','Unit','MRP INR','Wholesale INR','Stock','Low Stock Alert Qty','Wholesale Offers','Active'],
 rows.map(p=>[p.id,p.title,categoryName(p.category_id),p.unit,p.mrp_paise/100,p.price_paise/100,p.stock,Number(p.low_stock_alert_qty??10),(p.bulk_rules||[]).map((t,i)=>{const x=planData(t,p,i);return `${x.title}: ${x.units} units for ₹${(x.total/100).toFixed(2)} | profit ₹${(x.profit/100).toFixed(2)} (${pctPlan(x.margin)})`}).join(' || '),p.active]),
 'Current product catalogue; filters applied');
}
function exportLedger(){
 A.csv('Inventory Statement',['Date IST','Product ID','Product','Type','Reference','Opening','Stock In','Stock Out','Closing','Staff / Source','Note'],
 ledger.map(x=>[formatDate(x.occurred_at),x.product_id,x.product_title,movementLabel(x.movement_type),x.reference_id||'',x.stock_before,x.quantity_delta>0?x.quantity_delta:'',x.quantity_delta<0?Math.abs(x.quantity_delta):'',x.stock_after,x.actor_name||x.actor_role||'System',x.note||'']),
 $('statement-sub').textContent);
}
function printLedger(){
 const selected=products.find(p=>p.id===+$('ledger-product').value);
 const rows=ledger.map(x=>`<tr><td>${esc(formatDate(x.occurred_at))}</td><td>${esc(x.product_title)}</td><td>${esc(movementLabel(x.movement_type))}</td><td>${esc(x.reference_id||'')}</td><td>${x.stock_before}</td><td>${x.quantity_delta>0?x.quantity_delta:''}</td><td>${x.quantity_delta<0?Math.abs(x.quantity_delta):''}</td><td>${x.stock_after}</td><td>${esc(x.note||'')}</td></tr>`).join('');
 A.print(selected?`Inventory Statement · ${selected.title}`:'Inventory Statement · All Products',
 `<p>${esc($('statement-sub').textContent)}</p><table><thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Reference</th><th>Opening</th><th>In</th><th>Out</th><th>Closing</th><th>Narration</th></tr></thead><tbody>${rows}</tbody></table>`);
}

async function categoryManager(){
 A.modal('Categories',A.table(['Name','Status',''],categories.map(c=>[esc(c.name),A.badge(c.active?'active':'inactive'),`<button data-category-edit="${c.id}">Edit</button>`]))+'<button id="add-category" class="primary" style="margin-top:18px">Add category</button>');
 const open=c=>A.form(c?'Edit category':'Add category',[['name','Name','text',[],true],['active','Active','checkbox']],c||{active:true},async v=>{await A.api('admin.category.put',{...v,...(c?{id:c.id,expected_version:c.version}:{})});await loadProducts();});
 $('add-category').onclick=()=>open();
 for(const b of document.querySelectorAll('[data-category-edit]'))b.onclick=()=>open(categories.find(c=>c.id===+b.dataset.categoryEdit));
}

for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>showTab(b.dataset.tab);
for(const id of ['product-search','product-category','stock-filter','product-sort'])$(id).addEventListener('input',renderCatalogue);

$('sheet-view-top').onclick=$('sheet-view-toolbar').onclick=enterSheetView;
$('sheet-exit').onclick=exitSheetView;$('sheet-catalogue').onclick=()=>showTab('catalogue');$('sheet-inventory').onclick=()=>showTab('inventory');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetMode&&!productEditor.open&&!stockVoucher.open)exitSheetView()});
if($('new-product'))$('new-product').onclick=()=>openEditor();
if($('categories-btn'))$('categories-btn').onclick=()=>categoryManager().catch(A.error);
for(const id of ['stock-in-top','stock-in-toolbar','ledger-stock-in'])if($(id))$(id).onclick=()=>openVoucher('in');
for(const id of ['stock-out-top','stock-out-toolbar','ledger-stock-out'])if($(id))$(id).onclick=()=>openVoucher('out');
$('open-ledger').onclick=()=>showTab('inventory');
if($('product-export'))$('product-export').onclick=exportProducts;

$('ledger-refresh').onclick=async()=>{try{await loadLedger();window.__closeProductsSheets?.()}catch(e){A.error(e)}};
$('ledger-export').onclick=exportLedger;$('ledger-print').onclick=printLedger;
for(const b of document.querySelectorAll('[data-period]'))b.onclick=()=>{
 const today=new Date(Date.now()+19800000).toISOString().slice(0,10);
 if(b.dataset.period==='all'){$('ledger-from').value='';$('ledger-to').value=''}
 if(b.dataset.period==='today'){$('ledger-from').value=today;$('ledger-to').value=today}
 if(b.dataset.period==='7'){const d=new Date(today+'T00:00:00Z');$('ledger-from').value=new Date(d-6*86400000).toISOString().slice(0,10);$('ledger-to').value=today}
 if(b.dataset.period==='month'){$('ledger-from').value=today.slice(0,8)+'01';$('ledger-to').value=today}
 loadLedger().catch(A.error);
};

await loadProducts();

})().catch(e=>{
 if(window.App)App.fail(e);
 else document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;
});
</script>
</body>
</html>
