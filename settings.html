/* Boot */
.settings-boot{
 position:fixed;inset:0;z-index:100000;display:grid;place-items:center;

.settings-boot-inf path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.settings-boot-inf .base{stroke:#ead9aa;stroke-width:6}
.settings-boot-inf .flow{stroke:url(#settingsBootGold);stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1;animation:settingsInfinity 1.55s cubic-bezier(.65,0,.35,1) infinite}

 .settings-more-links a{
  min-height:40px;display:flex;align-items:center;padding:8px 10px;
  border:1px solid #e8ddc9;border-radius:8px;background:#fffaf0;
  color:#563c2e;text-decoration:none;font-size:12px;font-weight:800
 }
 .settings-more-links a.active{
  border-color:#c8942d;background:#f6ead3;color:var(--sx-wine)
 }
 .settings-more-signout{
  width:100%;min-height:40px!important;margin-top:8px;
  border-color:#edc8c0!important;background:#fff2ee!important;color:#9a3c31!important;font-size:12px!important
 }
}

@media(max-width:390px){
 .smart-cards{grid-template-columns:1fr!important}
 .team-stats{grid-template-columns:1fr 1fr!important}
 .backup-kpis{grid-template-columns:1fr!important}
 .preset-row{grid-template-columns:1fr!important}
 .settings-mobile-brand-copy span{display:none!important}
}

/* Splash Screens */
.splash-head{
 display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px
}
.splash-head h2{margin:0;color:var(--sx-wine-dark);font-size:23px}
.splash-head p{margin:5px 0 0;color:var(--sx-muted);font-size:13px;line-height:1.45}
.splash-list{display:grid;gap:8px}
.splash-card{
 display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:11px;align-items:center;
 padding:10px;border:1px solid var(--sx-line);border-radius:10px;background:#fffdf8
}
.splash-thumb{
 width:88px;height:104px;border-radius:8px;overflow:hidden;background:#071d35;
 display:grid;place-items:center;border:1px solid #e3d5bd
}
.splash-thumb img{width:100%;height:100%;object-fit:cover}
.splash-copy{min-width:0}
.splash-title{color:#4c191d;font-size:14px;font-weight:850}
.splash-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.splash-chip{
 display:inline-flex;padding:4px 7px;border-radius:999px;background:#f4ead5;
 color:#665032;font-size:9px;font-weight:850
}
.splash-chip.on{background:#eaf1e6;color:#356b4b}
.splash-chip.off{background:#fff0ec;color:#9a3c31}
.splash-caption{
 margin-top:6px;color:#776a60;font-size:11px;line-height:1.45;
 white-space:normal;overflow-wrap:anywhere
}
.splash-actions{display:grid;gap:5px;min-width:92px}
.splash-actions button{width:100%;min-height:33px!important;font-size:10px!important}
.splash-empty{
 padding:28px;border:1px dashed #dbc99f;border-radius:10px;background:#fffaf0;
 text-align:center;color:#786a60;font-size:12px
}
.splash-editor{display:grid;gap:12px}
.splash-editor-grid{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.splash-editor-grid .wide{grid-column:1/-1}
.splash-editor label{display:grid;gap:5px;font-size:12px;font-weight:750;color:#5f5148}
.splash-editor input,.splash-editor select,.splash-editor textarea{
 width:100%;min-height:41px;padding:8px 10px;border:1px solid #dcd0ba;border-radius:8px;
 background:#fff;font-size:14px;outline:none
}
.splash-editor textarea{min-height:76px;resize:vertical}
.splash-image-box{
 display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:center;
 padding:10px;border:1px solid #e2d4ba;border-radius:9px;background:#fffaf0
}
.splash-image-preview{
 width:140px;height:170px;border-radius:8px;overflow:hidden;background:#071d35;
 display:grid;place-items:center;color:#d2b567;font-size:11px;text-align:center
}
.splash-image-preview img{width:100%;height:100%;object-fit:cover}
.splash-upload-copy b{display:block;color:#4c191d;font-size:13px}
.splash-upload-copy p{margin:4px 0 8px;color:#786a60;font-size:11px;line-height:1.4}
.splash-pages{
 display:grid;grid-template-columns:repeat(4,1fr);gap:6px
}
.splash-page{
 display:flex!important;align-items:center!important;gap:6px!important;min-height:36px!important;
 padding:7px!important;border:1px solid #e6dac4!important;border-radius:7px!important;
 background:#fffdf8!important;font-size:11px!important;font-weight:750!important
}
.splash-page input{width:16px!important;height:16px!important;min-height:16px!important}
.splash-editor-note{
 padding:9px 10px;border-radius:8px;background:#fff3d4;color:#6f501b;
 font-size:11px;line-height:1.45
}
@media(max-width:760px){
 .splash-head{display:block}
 .splash-head button{width:100%;margin-top:8px}
 .splash-card{grid-template-columns:68px minmax(0,1fr);align-items:start}
 .splash-thumb{width:68px;height:84px}
 .splash-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;min-width:0}
 .splash-editor-grid{grid-template-columns:1fr}
 .splash-editor-grid .wide{grid-column:auto}
 .splash-image-box{grid-template-columns:88px minmax(0,1fr)}
 .splash-image-preview{width:88px;height:112px}
 .splash-pages{grid-template-columns:1fr 1fr}
}

</style>

<script>
(async()=>{
const response=await fetch(new URL('index.html',location.href),{cache:'no-cache'});
if(!response.ok)throw Error('Keep index.html in the same folder as this page.');
const shared=new DOMParser().parseFromString(await response.text(),'text/html');
for(const id of ['oneness-config','oneness-theme']){const node=shared.getElementById(id);if(!node)throw Error('index.html is incomplete.');document.head.append(node.cloneNode(true));}
const source=shared.getElementById('oneness-core');if(!source)throw Error('index.html is incomplete.');
const runtime=document.createElement('script');runtime.textContent=source.textContent;document.body.append(runtime);
const A=await App.init('settings'),{$,esc,money}=A;let profile=A.profile,settings=A.settings,coupons=[];let tab='home';

const PERMISSION_GROUPS=[
 ['Dashboard',[['dashboard.ops','Operational totals','Orders, fulfilment and stock overview'],['dashboard.finance','Financial totals','Revenue and collection totals']]],
 ['Products',[['products.view','View products','Read catalogue details'],['products.create','Create products','Add new catalogue items'],['products.edit','Edit details','Change names, descriptions and images'],['products.price','Edit prices','Change MRP and selling prices'],['products.stock','Adjust stock','Change inventory quantity'],['products.deactivate','Deactivate products','Hide a product from sale'],['products.import','Import products','Bulk upload catalogue data'],['products.export','Export products','Download catalogue data']]],
 ['Orders',[['orders.view','View orders','Open permitted orders'],['orders.view_amounts','View order amounts','Show unit/wholesale price, line amount, total, discount and delivery charge'],['orders.confirm','Confirm orders','Placed → confirmed'],['orders.pack','Mark packed','Reserved workflow permission'],['orders.dispatch','Mark dispatched','Confirmed/packed → dispatched'],['orders.deliver','Mark delivered','Dispatched → delivered'],['orders.cancel','Cancel orders','Cancel an eligible order'],['orders.print','Print slips','Print packing/dispatch slips']]],
 ['Financial information',[['finance.sell_price','View selling prices','See selling prices inside permitted screens'],['finance.cost','View costs','See purchase/cost values'],['finance.margin','View margins','See profit and margin data']]],
 ['Payments',[['payments.view','View collections','See payment/COD state'],['payments.cod_collect','Mark COD collected','Confirm COD collection'],['payments.export','Export payments','Download collection data'],['delivery.cod_amount','View COD amount','See amount a delivery employee must collect']]],
 ['Customers',[['customers.view','View customers','Open customer list'],['customers.edit','Edit customers','Edit customer information'],['customers.approve','Approve customers','Approve retailer accounts'],['customers.contact','View contact details','Phone/address when operationally required'],['customers.export','Export customers','Download customer data']]],
 ['Analytics',[['analytics.sales','Sales reports','See sales analytics'],['analytics.profit','Profit reports','See profit analytics'],['analytics.export','Export reports','Download analytical reports']]],
 ['Business settings',[['settings.store','Store settings','Store, delivery, minimum order and PIN codes'],['settings.coupons','Coupons','Create and manage coupons'],['settings.notifications','Notifications','Manage notification controls']]],
 ['Record scope',[['scope.orders.all','All orders','Access every permitted order'],['scope.orders.assigned','Assigned orders only','Requires backend order assignment']]]
];
const LEGACY_MAP={
 'dashboard.ops':'orders','dashboard.finance':'finance','products.view':'catalog','products.create':'catalog','products.edit':'catalog','products.price':'catalog','products.stock':'catalog','products.deactivate':'catalog','products.import':'catalog','products.export':'catalog',
 'orders.view':'orders','orders.confirm':'orders','orders.pack':'orders','orders.dispatch':'orders','orders.deliver':'orders','orders.cancel':'orders','orders.print':'orders',
 'finance.sell_price':'finance','finance.cost':'finance','finance.margin':'finance','payments.view':'finance','payments.cod_collect':'finance','payments.export':'finance','delivery.cod_amount':'orders',
 'customers.view':'users','customers.edit':'users','customers.approve':'users','customers.contact':'orders','customers.export':'users','analytics.sales':'finance','analytics.profit':'finance','analytics.export':'finance',
 'settings.store':'settings','settings.coupons':'coupons','settings.notifications':'notifications'
};
const PRESETS={
 'Packing & Dispatch':['orders.view','orders.pack','orders.dispatch','orders.print','customers.contact','scope.orders.all'],
 'Dispatch':['orders.view','orders.dispatch','orders.deliver','orders.print','customers.contact','delivery.cod_amount','scope.orders.all'],
 'Catalogue Manager':['products.view','products.create','products.edit','products.price','products.stock','products.deactivate','products.import','products.export'],
 'Accounts':['dashboard.finance','finance.sell_price','finance.cost','finance.margin','payments.view','payments.cod_collect','payments.export','analytics.sales','analytics.profit','analytics.export'],
 'Manager':['dashboard.ops','dashboard.finance','products.view','products.create','products.edit','products.price','products.stock','products.deactivate','orders.view','orders.view_amounts','orders.confirm','orders.dispatch','orders.deliver','orders.cancel','orders.print','finance.sell_price','payments.view','payments.cod_collect','customers.view','customers.contact','analytics.sales','settings.store','settings.coupons','settings.notifications','scope.orders.all'],
 'Custom':[]
};
const ALL_DETAIL=new Set(PERMISSION_GROUPS.flatMap(g=>g[1].map(x=>x[0])));
function normalizePerms(perms){return [...new Set((perms||[]).filter(Boolean))];}
function detailPerms(perms){return normalizePerms(perms).filter(p=>ALL_DETAIL.has(p));}
function buildStoredPermissions(detail){const out=new Set(detail);for(const p of detail){if(LEGACY_MAP[p])out.add(LEGACY_MAP[p]);}return [...out];}
function accessSummary(member){const d=detailPerms(member.permissions);if(member.role==='owner')return 'Full owner access';if(!d.length)return 'No business permissions';const preset=Object.entries(PRESETS).find(([name,arr])=>name!=='Custom'&&arr.length===d.length&&arr.every(x=>d.includes(x)));return preset?preset[0]:`${d.length} custom permissions`;}
function statusChip(status){return `<span class="chip ${status==='blocked'?'bad':status==='unverified'?'warn':''}">${esc(status)}</span>`;}

const SETTING_META={
 profile:{icon:'P',color:'#17634c',desc:'Your account, business name, phone and security.'},
 addresses:{icon:'A',color:'#4f6793',desc:'Saved delivery and business addresses.'},
 team:{icon:'T',color:'#7b5b96',desc:'Staff approvals, roles, permissions and sessions.'},
 store:{icon:'S',color:'#8a641e',desc:'Store name, delivery, minimum order and service PINs.'},
 payments:{icon:'₹',color:'#2c7a58',desc:'COD / online availability and retailer eligibility.'},
 coupons:{icon:'%',color:'#a24f3d',desc:'Discount codes, eligibility, dates and usage.'},
 notifications:{icon:'N',color:'#477b87',desc:'Push notification registration and device control.'},
 splash:{icon:'◫',color:'#8a641e',desc:'Promotional posters, audience targeting, pages and display frequency.'},
 backup:{icon:'B',color:'#2b6f58',desc:'Export the database or schedule encrypted server-side backups to Google Sheets.'},
 jobs:{icon:'J',color:'#675d51',desc:'Pending or failed backend synchronization jobs.'}
};

const tabs=[['profile','My profile'],['addresses','Addresses'],...(profile.role==='owner'?[['team','Team & Access'],['backup','Backup & Export']]:[]),...(A.can('settings')?[['store','Store'],['payments','Payments'],['splash','Splash Screens']]:[]),...(A.can('coupons')?[['coupons','Coupons']]:[]),['notifications','Notifications'],...(profile.role==='owner'?[['jobs','Sync jobs']]:[])];
$('view').innerHTML=`
<div class="settings-hero">
 <div><h1>Settings</h1><p>Control your account, store operations, team access, payments and communication from one place.</p></div>
 <div class="settings-hero-badge">${esc(profile.role)} · ${esc(profile.status)}</div>
</div>
<div id="settings-grid" class="settings-grid">
 ${tabs.map(([id,name])=>{const m=SETTING_META[id]||{icon:name[0],color:'#17634c',desc:''};return `<button class="setting-tile" data-tab="${id}" style="--tile:${m.color}"><span class="tile-icon">${esc(m.icon)}</span><span class="tile-copy"><b>${esc(name)}</b><span>${esc(m.desc)}</span></span><span class="tile-arrow">↗</span></button>`}).join('')}
</div>
<section id="settings-panel" class="settings-panel" hidden>
 <div class="settings-panel-head">
  <div class="settings-panel-title"><button id="settings-back">← All settings</button><div><b id="panel-title">Settings</b><span id="panel-subtitle">Manage this setting</span></div></div>
  <button id="panel-close" class="panel-close">Close</button>
 </div>
 <section id="settings-body" class="card"></section>
</section>
<input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
`;

async function show(next=tab){
 tab=next;
 if($('view'))$('view').scrollTop=0;
 window.__closeSettingsMobile?.();
 for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);
 const panel=$('settings-panel'),el=$('settings-body');
 if(tab==='home'){panel.hidden=true;return;}
 const item=tabs.find(x=>x[0]===tab),m=SETTING_META[tab]||{};
 $('panel-title').textContent=item?.[1]||'Settings';$('panel-subtitle').textContent=m.desc||'Manage this setting';
 panel.hidden=false;panel.classList.remove('panel-in');void panel.offsetWidth;panel.classList.add('panel-in');

async function imageFileBase64(file){
 if(!file)return '';
 if(file.size>5*1024*1024)throw Error('Use an image smaller than 5 MB.');
 if(!/^image\/(jpeg|png|webp)$/i.test(file.type))throw Error('Use JPG, PNG or WebP.');
 return await new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');
  r.onerror=()=>reject(Error('Could not read the selected image.'));
  r.readAsDataURL(file);
 });
}
async function uploadSplashImage(file){
 const base64=await imageFileBase64(file);
 const {data,error}=await A.client.functions.invoke('product-image-upload',{body:{base64,name:'splash-'+Date.now()+'-'+file.name}});
 if(error){
  let msg=error.message||'Image upload failed.';
  try{const body=await error.context?.json?.();msg=body?.error?.message||msg}catch{}
  throw Error(msg);
 }
 if(data?.ok!==true||!data?.data?.url)throw Error(data?.error?.message||'Image upload was not confirmed.');
 return data.data.url;
}

async function backupApi(action,data={}){
 const {data:result,error}=await A.client.functions.invoke('admin-backup',{body:{action,data}});
 if(error)throw Error(error.message||'Backup service request failed.');
 if(!result||result.ok!==true)throw Error(result?.error?.message||'Backup service request failed.');
 return result.data;
}
function backupDate(v){return v?new Date(v).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'}):'—'}
function backupInputDate(v){if(!v)return '';return new Date(Date.parse(v)+19800000).toISOString().slice(0,16)}
function backupCell(v){
 if(v===null||v===undefined)return '';
 if(Array.isArray(v)||typeof v==='object')return JSON.stringify(v);
 return v;
}
function backupSheetName(name,used){
 let base=String(name||'Sheet').replace(/[\\\\/?*\\[\\]:]/g,' ').trim().slice(0,31)||'Sheet',candidate=base,n=2;
 while(used.has(candidate)){const suffix=` ${n++}`;candidate=(base.slice(0,31-suffix.length)+suffix)}
 used.add(candidate);return candidate;
}
const loadBackupScript=src=>new Promise((resolve,reject)=>{
 const old=[...document.scripts].find(s=>s.src===src);
 if(old){if(old.dataset.loaded==='1')return resolve();old.addEventListener('load',resolve,{once:true});old.addEventListener('error',reject,{once:true});return}
 const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>{s.dataset.loaded='1';resolve()};s.onerror=()=>reject(Error('Could not load Excel export library. Check internet access.'));document.head.append(s);
});
async function exportDatabaseExcel(btn){
 btn.disabled=true;const old=btn.textContent;btn.textContent='Preparing database…';
 try{
  const snap=await backupApi('snapshot');
  await loadBackupScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  if(!window.XLSX)throw Error('Excel library did not load.');
  const wb=XLSX.utils.book_new(),used=new Set(),tables=snap.tables||{};
  for(const [name,raw] of Object.entries(tables)){
   const rows=Array.isArray(raw)?raw:[],keys=[];
   for(const row of rows)for(const key of Object.keys(row||{}))if(!keys.includes(key))keys.push(key);
   const matrix=keys.length?[keys,...rows.map(row=>keys.map(k=>backupCell(row?.[k])))]:[['No rows']];
   const ws=XLSX.utils.aoa_to_sheet(matrix);
   ws['!cols']=keys.length?keys.map((k,i)=>({wch:Math.min(38,Math.max(11,k.length+2,...rows.slice(0,80).map(r=>String(backupCell(r?.[k])??'').length).map(n=>Math.min(n,34))))} )):[{wch:18}];
   XLSX.utils.book_append_sheet(wb,ws,backupSheetName(name,used));
  }
  const stamp=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`oneness-database-backup-${stamp}.xlsx`);
  A.toast('Database Excel backup created');
 }finally{btn.disabled=false;btn.textContent=old}
}

function buildSettingsMobileChrome(){
 const links=[...document.querySelectorAll('.side nav a')].map(a=>({
  href:a.getAttribute('href'),label:a.textContent.trim(),active:a.classList.contains('active')
 }));
 const key=x=>String(x.href||'').replace('.html','');
 const preferred=['dashboard','products','orders','settings'],primary=[];
 for(const k of preferred){const x=links.find(v=>key(v)===k);if(x&&!primary.includes(x))primary.push(x)}
 for(const x of links){if(primary.length>=4)break;if(!primary.includes(x))primary.push(x)}

 const initial=String(profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
 const avatar=profile?.avatar_url
  ?`<img src="${esc(profile.avatar_url)}" alt="Profile photo" onerror="this.remove();this.parentElement.textContent='${esc(initial)}'">`
  :esc(initial);

 const bar=document.createElement('header');
 bar.className='settings-mobile-appbar';
 bar.innerHTML=`<div class="settings-mobile-brand"><img src="${ONENESS_MARK}" alt="ONeness"><span class="settings-mobile-brand-copy"><b>ONENESS GROUP</b><span>Settings & Administration</span></span></div><button id="settings-mobile-profile" class="settings-mobile-avatar" aria-label="Account">${avatar}</button>`;
 document.body.append(bar);

 const nav=document.createElement('nav');
 nav.className='settings-mobile-bottom';
 nav.innerHTML=primary.slice(0,4).map(x=>`<a class="settings-mobile-nav ${x.active?'active':''}" href="${esc(x.href)}">${settingsNavIcon(key(x))}<span>${esc(x.label)}</span></a>`).join('')+`<button id="settings-mobile-more-btn" class="settings-mobile-nav more">${settingsNavIcon('more')}<span>More</span></button>`;
 document.body.append(nav);

 const backdrop=document.createElement('div');
 backdrop.className='settings-mobile-backdrop';
 backdrop.id='settings-mobile-backdrop';
 document.body.append(backdrop);

 const more=document.createElement('section');
 more.className='settings-mobile-more';
 more.id='settings-mobile-more';
 more.innerHTML=`<div class="settings-more-profile"><div class="settings-more-avatar">${avatar}</div><div class="settings-more-copy"><b>${esc(profile?.name||'Administrator')}</b><span>${esc(profile?.role||'admin')}</span></div></div><div class="settings-more-links">${links.map(x=>`<a class="${x.active?'active':''}" href="${esc(x.href)}">${esc(x.label)}</a>`).join('')}</div><button id="settings-mobile-signout" class="settings-more-signout">Sign out</button>`;
 document.body.append(more);

 const close=()=>{more.classList.remove('open');backdrop.classList.remove('show')};
 const open=()=>{more.classList.add('open');backdrop.classList.add('show')};
 document.getElementById('settings-mobile-more-btn').onclick=open;
 document.getElementById('settings-mobile-profile').onclick=open;
 document.getElementById('settings-mobile-signout').onclick=()=>document.getElementById('logout')?.click();
 backdrop.onclick=close;
 window.__closeSettingsMobile=close;
}

function installSettingsTransition(){
 const overlay=document.createElement('div');
 overlay.className='settings-page-transition';
 overlay.style.cssText='position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(251,247,238,.96);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.14s ease';
 overlay.innerHTML=`<div class="settings-boot-wrap"><img src="${ONENESS_MARK}" alt="" class="settings-boot-logo"><svg class="settings-boot-inf" viewBox="0 0 100 58" aria-hidden="true"><defs><linearGradient id="settingsPageGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a56e15"/><stop offset=".46" stop-color="#f0cf72"/><stop offset="1" stop-color="#b77b1c"/></linearGradient></defs><path pathLength="1" class="base" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="flow" style="stroke:url(#settingsPageGold)" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/><path pathLength="1" class="shine" d="M8 29 C18 8 34 8 50 29 C66 50 82 50 92 29 C82 8 66 8 50 29 C34 50 18 50 8 29"/></svg><div class="settings-boot-sub">Opening page</div></div>`;
 document.body.append(overlay);
 document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a||a.target==='_blank'||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
  let u;try{u=new URL(a.href,location.href)}catch{return}
  if(u.origin===location.origin&&u.pathname!==location.pathname){
   overlay.style.opacity='1';overlay.style.visibility='visible';
  }
 });
}

function enhanceAdminShell(){
 document.body.classList.add('settings-console');
 const side=document.querySelector('.side');
 const brand=side?.querySelector('.brand');
 if(brand)brand.innerHTML=`<img class="settings-side-logo" src="${ONENESS_MARK}" alt="ONeness Group"><span class="settings-side-copy"><strong>ONENESS GROUP</strong><span>Lakhpati Didi Program</span></span>`;

 const bottom=side?.querySelector('.bottom'),logout=document.getElementById('logout');
 if(!bottom)return;
 const initial=(profile?.name||'A').trim().charAt(0).toUpperCase()||'A';
 const avatar=profile?.avatar_url
  ?`<img src="${esc(profile.avatar_url)}" alt="Profile photo" onerror="this.remove();this.parentElement.innerHTML='<span class=&quot;avatar-initial&quot;>${esc(initial)}</span>'">`
  :`<span class="avatar-initial">${esc(initial)}</span>`;
 bottom.className='bottom admin-bottom-card';
 bottom.innerHTML=`<div class="admin-profile"><button id="avatar-btn" class="avatar-btn" title="Change profile photo">${avatar}</button><div class="admin-profile-copy"><b>${esc(profile?.name||'Administrator')}</b><span>${esc(profile?.role||'admin')}</span></div></div>`;
 if(logout){logout.className='';bottom.append(logout)}
 $('avatar-btn').onclick=()=>$('avatar-file').click();
 $('avatar-file').onchange=uploadAvatar;
}
enhanceAdminShell();
buildSettingsMobileChrome();
installSettingsTransition();
$('settings-back').onclick=$('panel-close').onclick=()=>show('home').catch(A.error);
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>show(b.dataset.tab).catch(A.error);
await show('home');
})().catch(e=>{if(window.App)App.fail(e);else{document.body.textContent="Could not load ONeness. Serve all HTML files together over HTTP/HTTPS. "+e.message;}});
</script></body></html>
